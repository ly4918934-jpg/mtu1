        function normalizeAppState() {
            if (!appState || typeof appState !== 'object') return;
            appState.supabaseConfig = { url: "", key: "", connected: false, ...(appState.supabaseConfig || {}) };
            appState.googleConfig = { clientId: "", connected: false, fileId: "", ...(appState.googleConfig || {}) };
            appState.schoolInfo = {
                name: "جامعة بغداد - كلية الهندسة",
                university: "جامعة بغداد",
                college: "كلية الهندسة",
                department: "القسم",
                teacher: "الأستاذ الجامعي",
                subject: "",
                year: "",
                logo: "",
                ...(appState.schoolInfo || {})
            };
            appState.classes = Array.isArray(appState.classes) ? appState.classes : [];
            appState.students = Array.isArray(appState.students) ? appState.students : [];
            appState.subjects = Array.isArray(appState.subjects) ? appState.subjects : [];
            // توحيد ربط المواد القديمة: إذا كانت المادة مرتبطة بالمرحلة فقط، تُربط بكل شعبة/دراسة موجودة لتلك المرحلة، دون تكرار ربط موجود مسبقاً.
            const sourceSubjects = appState.subjects.filter(subject => subject && typeof subject === 'object');
            const exactSubjectKeys = new Set(sourceSubjects.filter(subject => String(subject.section || '').trim()).map(subject =>
                getSubjectAssignmentKey(subject.name, subject.class, subject.section, subject.studyType || 'صباحي')
            ));
            const normalizedSubjects = [];
            const normalizedSubjectKeys = new Set();
            sourceSubjects.forEach(subject => {
                subject.name = String(subject.name || '').trim();
                subject.class = String(subject.class || '').trim();
                subject.section = String(subject.section || '').trim();
                subject.studyType = String(subject.studyType || '').trim();

                if (subject.section) {
                    const matchingClass = appState.classes.find(cls =>
                        normalizeAcademicText(cls.name) === normalizeAcademicText(subject.class) &&
                        normalizeAcademicText(cls.section) === normalizeAcademicText(subject.section) &&
                        normalizeAcademicText(cls.studyType || 'صباحي') === normalizeAcademicText(subject.studyType || 'صباحي')
                    );
                    if (matchingClass) {
                        subject.class = matchingClass.name;
                        subject.section = String(matchingClass.section || '').trim();
                        subject.studyType = String(matchingClass.studyType || 'صباحي').trim();
                    }
                    const key = getSubjectAssignmentKey(subject.name, subject.class, subject.section, subject.studyType || 'صباحي');
                    if (!normalizedSubjectKeys.has(key)) {
                        normalizedSubjectKeys.add(key);
                        normalizedSubjects.push(subject);
                    }
                    return;
                }

                const matchingClasses = subject.class
                    ? appState.classes.filter(cls => normalizeAcademicText(cls.name) === normalizeAcademicText(subject.class))
                    : [];
                if (!matchingClasses.length) {
                    const key = getSubjectAssignmentKey(subject.name, subject.class, subject.section, subject.studyType || 'صباحي');
                    if (!normalizedSubjectKeys.has(key)) {
                        normalizedSubjectKeys.add(key);
                        normalizedSubjects.push(subject);
                    }
                    return;
                }

                matchingClasses.forEach((cls, index) => {
                    const linked = { ...subject, class: cls.name, section: String(cls.section || '').trim(), studyType: String(cls.studyType || 'صباحي').trim() };
                    const key = getSubjectAssignmentKey(linked.name, linked.class, linked.section, linked.studyType);
                    // لا تُنشئ نسخاً من ربط موجود مسبقاً لهذه الشعبة.
                    if (exactSubjectKeys.has(key) || normalizedSubjectKeys.has(key)) return;
                    if (index > 0 || matchingClasses.length > 1) linked.id = Date.now() + Math.random();
                    normalizedSubjectKeys.add(key);
                    normalizedSubjects.push(linked);
                });
            });
            appState.subjects = normalizedSubjects;
            appState.schedule = Array.isArray(appState.schedule) ? appState.schedule : [];
            appState.savedSessions = Array.isArray(appState.savedSessions) ? appState.savedSessions : [];
            appState.students.forEach(student => {
                if (student.id !== undefined && student.id !== null) student.id = typeof student.id === 'string' && student.id.trim() !== '' ? (Number.isFinite(Number(student.id)) ? Number(student.id) : student.id) : student.id;
                if (!Array.isArray(student.absenceLog)) student.absenceLog = [];
            });

            // ترحيل روابط المواد القديمة مرة واحدة فقط؛ حتى لا تعود مادة أزيل ربطها يدوياً بسبب وجود سجلات تاريخية.
            const shouldMigrateLegacySubjectLinks = Number(appState.subjectAssignmentSchemaVersion || 0) < 2;
            const ensureSubjectAssignment = (subjectName, className, section, studyType) => {
                const cleanName = String(subjectName || '').trim();
                if (!cleanName || !className || section === undefined || section === null) return;
                const classRecord = appState.classes.find(cls =>
                    normalizeAcademicText(cls.name) === normalizeAcademicText(className) &&
                    normalizeAcademicText(cls.section) === normalizeAcademicText(section) &&
                    normalizeAcademicText(cls.studyType || 'صباحي') === normalizeAcademicText(studyType || 'صباحي')
                );
                if (!classRecord) return;
                const exists = appState.subjects.some(subject =>
                    getSubjectAssignmentKey(subject.name, subject.class, subject.section, subject.studyType || 'صباحي') ===
                    getSubjectAssignmentKey(cleanName, classRecord.name, classRecord.section, classRecord.studyType || 'صباحي')
                );
                if (!exists) appState.subjects.push({
                    id: Date.now() + Math.random(), name: cleanName, class: classRecord.name,
                    section: String(classRecord.section || '').trim(), studyType: String(classRecord.studyType || 'صباحي').trim(),
                    teacher: appState.schoolInfo.teacher || ''
                });
            };

            if (shouldMigrateLegacySubjectLinks) {
                appState.students.forEach(student => {
                    ensureSubjectAssignment(student.subject, student.class, student.section, student.studyType || 'صباحي');
                    (Array.isArray(student.behaviorLog) ? student.behaviorLog : []).forEach(log => {
                        if (!log) return;
                        ensureSubjectAssignment(log.subject, log.stage || student.class, log.section == null ? student.section : log.section, log.studyType || student.studyType || 'صباحي');
                    });
                });
                appState.savedSessions.forEach(session => {
                    if (session) ensureSubjectAssignment(session.subject, session.className, session.section, session.studyType || 'صباحي');
                });
                appState.schedule.forEach(item => {
                    if (!item || !item.subject) return;
                    const match = String(item.className || '').match(/^(.*?)\s*\((.*?)\s*-\s*(.*?)\)\s*$/);
                    if (match) ensureSubjectAssignment(item.subject, match[1].trim(), match[2].trim(), match[3].trim());
                });
                appState.subjectAssignmentSchemaVersion = 2;
            }

            // فهرس مستقل للمواد: سجل المادة هنا لا يحمل مرحلة أو شعبة؛ الربط بالشعب محفوظ في appState.subjects.
            const catalogSource = Array.isArray(appState.subjectCatalog) ? appState.subjectCatalog : [];
            const catalogMap = new Map();
            [...catalogSource, ...(appState.subjects || [])].forEach(item => {
                const name = String(typeof item === 'string' ? item : (item && item.name) || '').trim();
                if (!name) return;
                const key = normalizeAcademicText(name);
                if (!catalogMap.has(key)) {
                    catalogMap.set(key, {
                        id: item && item.id != null ? item.id : (Date.now() + Math.random()),
                        name,
                        teacher: (item && item.teacher) || (appState.schoolInfo && appState.schoolInfo.teacher) || ''
                    });
                } else {
                    const existing = catalogMap.get(key);
                    if (!existing.teacher && item && item.teacher) existing.teacher = item.teacher;
                }
            });
            appState.subjectCatalog = Array.from(catalogMap.values()).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        }

        function normalizeAcademicText(value) {
            return String(value == null ? '' : value).normalize('NFKC').trim().toLocaleLowerCase('ar');
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function getSubjectAssignmentKey(subjectName, className, section, studyType) {
            return [subjectName, className, section, studyType || 'صباحي'].map(normalizeAcademicText).join('||');
        }

        function parseClassSelection(value) {
            const parts = String(value || '').split(' - ');
            return {
                name: (parts[0] || '').trim(),
                section: (parts[1] || '').trim(),
                studyType: (parts.slice(2).join(' - ') || 'صباحي').trim()
            };
        }

        function getClassSubjectNames(classRecord) {
            if (!classRecord) return [];
            const seen = new Set();
            return appState.subjects
                .filter(subject => normalizeAcademicText(subject.class) === normalizeAcademicText(classRecord.name) &&
                    normalizeAcademicText(subject.section) === normalizeAcademicText(classRecord.section) &&
                    normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(classRecord.studyType || 'صباحي'))
                .map(subject => String(subject.name || '').trim())
                .filter(name => {
                    const key = normalizeAcademicText(name);
                    if (!name || seen.has(key)) return false;
                    seen.add(key);
                    return true;
                })
                .sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getAllRegisteredSubjectNames() {
            const names = new Map();
            (appState.subjectCatalog || []).forEach(item => {
                const name = String(item && item.name || '').trim();
                const key = normalizeAcademicText(name);
                if (name && !names.has(key)) names.set(key, name);
            });
            // Fallback for imported/older records until normalizeAppState runs.
            (appState.subjects || []).forEach(item => {
                const name = String(item && item.name || '').trim();
                const key = normalizeAcademicText(name);
                if (name && !names.has(key)) names.set(key, name);
            });
            return [...names.values()].sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getSubjectNamesForClassSelection(classValue) {
            if (!classValue || classValue === 'all') return getAllRegisteredSubjectNames();
            const parts = parseClassSelection(classValue);
            const classRecord = appState.classes.find(cls =>
                normalizeAcademicText(cls.name) === normalizeAcademicText(parts.name) &&
                normalizeAcademicText(cls.section) === normalizeAcademicText(parts.section) &&
                normalizeAcademicText(cls.studyType || 'صباحي') === normalizeAcademicText(parts.studyType || 'صباحي')
            );
            return classRecord ? getClassSubjectNames(classRecord) : [];
        }

        function getSubjectOptionsHtmlForClass(classValue, selectedSubject = '') {
            const names = getSubjectNamesForClassSelection(classValue);
            if (!names.length) return '<option value="">لا توجد مواد مرتبطة بهذه الشعبة</option>';
            const hasSelected = names.some(name => normalizeAcademicText(name) === normalizeAcademicText(selectedSubject));
            return names.map((name, index) => `<option value="${escapeHtml(name)}" ${(hasSelected ? normalizeAcademicText(name) === normalizeAcademicText(selectedSubject) : index === 0) ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('');
        }

        function applyClassSubjectNames(classRecord, rawNames) {
            if (!classRecord) return;
            const catalogNames = new Map((appState.subjectCatalog || []).map(item => [normalizeAcademicText(item.name), String(item.name || '').trim()]));
            const rawRequested = String(rawNames || '').split(/[,،;؛\n\r]+/).map(name => name.trim()).filter(Boolean);
            const requestedNames = [];
            const seenNames = new Set();
            const unknownNames = [];
            rawRequested.forEach(name => {
                const key = normalizeAcademicText(name);
                const canonical = catalogNames.get(key);
                if (!canonical) { unknownNames.push(name); return; }
                if (!seenNames.has(key)) {
                    seenNames.add(key);
                    requestedNames.push(canonical);
                }
            });

            const identityMatches = subject =>
                normalizeAcademicText(subject.class) === normalizeAcademicText(classRecord.name) &&
                normalizeAcademicText(subject.section) === normalizeAcademicText(classRecord.section) &&
                normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(classRecord.studyType || 'صباحي');

            appState.subjects = appState.subjects.filter(subject => !identityMatches(subject) || seenNames.has(normalizeAcademicText(subject.name)));
            requestedNames.forEach(name => {
                const exists = appState.subjects.some(subject => identityMatches(subject) && normalizeAcademicText(subject.name) === normalizeAcademicText(name));
                if (!exists) appState.subjects.push({
                    id: Date.now() + Math.random(),
                    name,
                    class: classRecord.name,
                    section: String(classRecord.section || '').trim(),
                    studyType: String(classRecord.studyType || 'صباحي').trim(),
                    teacher: (appState.subjectCatalog.find(item => normalizeAcademicText(item.name) === normalizeAcademicText(name)) || {}).teacher || (appState.schoolInfo && appState.schoolInfo.teacher) || ''
                });
            });
            if (unknownNames.length) showToast('تم تجاهل مواد غير مسجلة في تبويب إضافة مادة دراسية: ' + unknownNames.slice(0, 2).join('، '), 'error');
        }

        function appendClassSubject(inputId, pickerId) {
            const input = document.getElementById(inputId);

            if (!input || !pickedName) return;
            const currentNames = String(input.value || '').split(/[,،;؛\n\r]+/).map(name => name.trim()).filter(Boolean);
            if (!currentNames.some(name => normalizeAcademicText(name) === normalizeAcademicText(pickedName))) {
                input.value = currentNames.length ? currentNames.join('، ') + '، ' + pickedName : pickedName;
            }

        // دالة مساعدة لتوليد خيارات المراحل مدمجة مع الشعبة ونوع الدراسة لتعميمها

        // دالة الترتيب الأبجدي الموحدة للغة العربية

        // --- Supabase Cloud Database Realtime Engine ---
        function initSupabase() {
            const url = appState.supabaseConfig.url;
            const key = appState.supabaseConfig.key;

            if (url && key) {
                try {
                    supabaseClient = supabase.createClient(url, key);
                    testSupabaseConnection(false);
                } catch(e) {
                    console.error("Supabase Init Error:", e);
                    setSupabaseStatus(false);
                }
            } else {
                setSupabaseStatus(false);
            }
        }

        async function testSupabaseConnection(showAlert = true) {
            if (!supabaseClient) {
                setSupabaseStatus(false);
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('professor_data')
                    .select('data')
                    .eq('id', 'main_academic_state')
                    .single();

                if (error && error.code !== 'PGRST116') {
                    throw error;
                }

                setSupabaseStatus(true);
                if (data && data.data) {
                    const localConfig = appState.supabaseConfig;
                    const localGoogleConfig = appState.googleConfig || { clientId: "", connected: false, fileId: "" };
                    appState = data.data;
                    appState.supabaseConfig = localConfig;
                    appState.googleConfig = localGoogleConfig;
                    normalizeAppState();
                    persistLocalState();
                    renderContent();
                    updateStatsBar();
                } else {
                    syncStateToCloud({ immediate: true });
                }

                if (showAlert) showToast("تم الاتصال بقاعدة بيانات Supabase بنجاح!");
            } catch(err) {
                console.error("Supabase Error:", err);
                setSupabaseStatus(false);
                if (showAlert) showToast("فشل الاتصال: تأكد من تشغيل كود SQL لإنشاء جدول professor_data", "error");
            }
        }

        function setSupabaseStatus(isConnected) {
            appState.supabaseConfig.connected = isConnected;
            const badge = document.getElementById('supabase-status-badge');
            const dot = document.getElementById('supabase-status-dot');
            const text = document.getElementById('supabase-status-text');

            if (!badge || !dot || !text) return;

            if (isConnected) {
                badge.className = "text-[10px] bg-emerald-500/20 border border-emerald-500/40 px-3 py-1 rounded-full text-emerald-300 font-bold backdrop-blur-md flex items-center gap-1.5 shadow-sm transition-all duration-300";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                text.innerText = "سحابي متصل ✓";
            } else {
                badge.className = "text-[10px] bg-rose-500/20 border border-rose-500/40 px-3 py-1 rounded-full text-rose-300 font-bold backdrop-blur-md flex items-center gap-1.5 shadow-sm transition-all duration-300";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.innerText = "سحابي غير متصل";
            }
        }

        function persistLocalState() {
            try {
                localStorage.setItem('sp_academic_local_data', JSON.stringify(appState));
            } catch (storageError) {
                console.warn('LocalStorage save error:', storageError);
            }
        }

        // حفظ محلي فوري، ثم دمج تغييرات الحفظ السحابي المتتابعة في طلب واحد سريع.
        function syncStateToCloud(options = {}) {
            persistLocalState();

            if (googleAccessToken) scheduleGoogleDriveSync();

            // إذا استنفدت محاولات دفعة سابقة، امنح التغيير الجديد دورة إعادة محاولة جديدة.
            if (cloudSyncRetryCount >= 5 && cloudSyncSavedRevision < cloudSyncRevision) cloudSyncRetryCount = 0;
            cloudSyncRevision++;
            if (!supabaseClient || !appState.supabaseConfig || !appState.supabaseConfig.connected) return;

            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                syncTimeout = null;
                flushSupabaseSync();
            }, options.immediate ? 0 : CLOUD_SYNC_DEBOUNCE_MS);
        }

        async function flushSupabaseSync() {
            if (!supabaseClient || !appState.supabaseConfig || !appState.supabaseConfig.connected) return;
            if (cloudSyncInProgress) {
                cloudSyncPending = true;
                return;
            }
            // يمنع إرسال طلب مكرر إذا كان مؤقت الحفظ ينتظر بينما وصلت آخر نسخة للطابور.
            if (syncTimeout) {
                clearTimeout(syncTimeout);
                syncTimeout = null;
            }

            cloudSyncInProgress = true;
            let shouldRetry = false;
            try {
                do {
                    cloudSyncPending = false;
                    const revisionBeingSaved = cloudSyncRevision;
                    // Snapshot ثابت يمنع تغيّر الحمولة أثناء انتظار استجابة الشبكة.
                    const payloadSnapshot = JSON.parse(JSON.stringify(appState));
                    const { error } = await supabaseClient
                        .from('professor_data')
                        .upsert({
                            id: 'main_academic_state',
                            data: payloadSnapshot,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'id' });

                    if (error) throw error;
                    cloudSyncSavedRevision = revisionBeingSaved;
                    cloudSyncRetryCount = 0;

                    // إذا تغيّرت البيانات أثناء الحفظ، ارسل أحدث نسخة قبل إيقاف الطابور.
                    if (cloudSyncRevision > revisionBeingSaved) cloudSyncPending = true;
                } while (cloudSyncPending);
            } catch (err) {
                shouldRetry = true;
                console.warn('Supabase cloud save failed; local copy is preserved:', err);
            } finally {
                cloudSyncInProgress = false;

                if (cloudSyncPending && !shouldRetry) {
                    cloudSyncPending = false;
                    flushSupabaseSync();
                }

                // إعادة محاولة محدودة بتأخير تصاعدي؛ تظل النسخة المحلية محفوظة دائماً.
                if (shouldRetry && cloudSyncSavedRevision < cloudSyncRevision && cloudSyncRetryCount < 5) {
                    const delay = Math.min(15000, 1000 * (2 ** cloudSyncRetryCount));
                    cloudSyncRetryCount++;
                    if (cloudSyncRetryTimeout) clearTimeout(cloudSyncRetryTimeout);
                    cloudSyncRetryTimeout = setTimeout(() => {
                        cloudSyncRetryTimeout = null;
                        flushSupabaseSync();
                    }, delay);
                }
            }
        }

        async function ensureGoogleIdentityLoaded() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) return;
            await new Promise((resolve, reject) => {
                let script = document.querySelector('script[data-google-identity-loader]');
                if (script) {
                    script.addEventListener('load', resolve, { once: true });
                    script.addEventListener('error', reject, { once: true });
                    return;
                }
                script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                script.dataset.googleIdentityLoader = 'true';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
            if (!(window.google && window.google.accounts && window.google.accounts.oauth2)) {
                throw new Error('تعذر تحميل مكتبة تسجيل الدخول من Google');
            }
        }

        function saveGoogleClientIdFromForm() {
            const input = document.getElementById('google-client-id-input');
            if (input) appState.googleConfig.clientId = input.value.trim();
            if (!appState.googleConfig.clientId) {
                showToast('أدخل Google OAuth Client ID أولاً ثم احفظ الإعدادات', 'error');
                return false;
            }
            try { localStorage.setItem('sp_academic_local_data', JSON.stringify(appState)); } catch (e) {}
            return true;
        }

        async function requestGoogleDriveAccessToken() {
            await ensureGoogleIdentityLoaded();
            return await new Promise((resolve, reject) => {
                try {
                    googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: appState.googleConfig.clientId,
                        scope: 'https://www.googleapis.com/auth/drive.appdata',
                        callback: (response) => {
                            if (response && response.access_token) {
                                googleAccessToken = response.access_token;
                                resolve(response);
                            } else {
                                reject(new Error((response && (response.error_description || response.error)) || 'لم يتم منح إذن الوصول إلى Google Drive'));
                            }
                        },
                        error_callback: (error) => reject(new Error((error && error.message) || 'تعذر إكمال تسجيل الدخول إلى Google'))
                    });
                    googleTokenClient.requestAccessToken({ prompt: 'consent' });
                } catch (error) { reject(error); }
            });
        }

        async function googleDriveFetch(url, options = {}) {
            if (!googleAccessToken) throw new Error('حساب Google غير متصل. أعد الربط أولاً.');
            const headers = { Authorization: `Bearer ${googleAccessToken}`, ...(options.headers || {}) };
            const response = await fetch(url, { ...options, headers });
            if (!response.ok) {
                const detail = await response.text().catch(() => '');
                if (response.status === 401) {
                    googleAccessToken = null;
                    updateGoogleDriveStatus('انتهت صلاحية الاتصال. أعد الربط بحساب Google للمتابعة.');
                }
                throw new Error(`Google Drive (${response.status}): ${detail || response.statusText}`);
            }
            return response;
        }

        async function findGoogleDriveBackup() {
            const query = encodeURIComponent(`name = '${GOOGLE_DRIVE_BACKUP_NAME}' and trashed = false`);
            const url = `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&pageSize=100&fields=files(id,name,modifiedTime)`;
            const response = await googleDriveFetch(url);
            const data = await response.json();
            const file = (data.files || []).find(item => item.name === GOOGLE_DRIVE_BACKUP_NAME);
            appState.googleConfig.fileId = file ? file.id : '';
            return file || null;
        }

        async function writeGoogleDriveBackup() {
            if (!googleAccessToken) return false;
            const backupPayload = JSON.stringify(appState);
            let fileId = appState.googleConfig && appState.googleConfig.fileId;
            if (!fileId) {
                const existing = await findGoogleDriveBackup();
                fileId = existing && existing.id;
            }
            if (!fileId) {
                const createResponse = await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: GOOGLE_DRIVE_BACKUP_NAME, parents: ['appDataFolder'], mimeType: 'application/json' })
                });
                const created = await createResponse.json();
                fileId = created.id;
                appState.googleConfig.fileId = fileId;
            }
            await googleDriveFetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: backupPayload
            });
            try { localStorage.setItem('sp_academic_local_data', JSON.stringify(appState)); } catch (e) {}
            updateGoogleDriveStatus('تمت مزامنة البيانات إلى Google Drive');
            return true;
        }

        async function readGoogleDriveBackup() {
            const file = await findGoogleDriveBackup();
            if (!file) return false;
            const response = await googleDriveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`);
            const remoteState = await response.json();
            if (!remoteState || !Array.isArray(remoteState.students)) throw new Error('ملف النسخة السحابية لا يحتوي على بيانات منظومة صالحة');
            const localSupabaseConfig = appState.supabaseConfig;
            const localGoogleConfig = { ...(appState.googleConfig || {}), connected: true, fileId: file.id };
            appState = remoteState;
            appState.supabaseConfig = localSupabaseConfig;
            appState.googleConfig = localGoogleConfig;
            normalizeAppState();
            updateStatsBar();
            renderContent();
            persistLocalState();
            // إبقاء قاعدة Supabase الحالية متزامنة مع البيانات المستعادة أيضاً.
            if (supabaseClient && appState.supabaseConfig.connected) syncStateToCloud();
            return true;
        }

        async function connectGoogleDrive() {
            if (!appState.googleConfig) appState.googleConfig = { clientId: '', connected: false, fileId: '' };
            if (!saveGoogleClientIdFromForm()) return;
            try {
                updateGoogleDriveStatus('جارٍ فتح نافذة تسجيل الدخول إلى Google…');
                await requestGoogleDriveAccessToken();
                appState.googleConfig.connected = true;
                updateGoogleDriveStatus('تم تسجيل الدخول، جارٍ البحث عن النسخة السحابية…');
                const restored = await readGoogleDriveBackup();
                if (restored) {
                    showToast('تم ربط Google واستعادة البيانات السحابية بنجاح');
                } else {
                    await writeGoogleDriveBackup();
                    showToast('تم ربط Google وحفظ بيانات المنظومة الحالية في السحابة');
                }
                syncStateToCloud();
                updateGoogleDriveStatus('Google Drive متصل والمزامنة مفعلة');
            } catch (error) {
                console.error('Google Drive connection error:', error);
                updateGoogleDriveStatus('تعذر الربط: ' + (error.message || 'تحقق من إعدادات Google'));
                showToast('فشل الربط مع Google: تحقق من Client ID وتفعيل Drive API', 'error');
            }
        }

        function scheduleGoogleDriveSync() {
            if (!googleAccessToken) return;
            if (googleSyncTimeout) clearTimeout(googleSyncTimeout);
            googleSyncTimeout = setTimeout(async () => {
                try {
                    if (googleSyncInProgress) { googleSyncPending = true; return; }
                    googleSyncInProgress = true;
                    await writeGoogleDriveBackup();
                } catch (error) {
                    console.warn('Google Drive background sync failed:', error);
                    updateGoogleDriveStatus('تعذرت المزامنة. افتح إعدادات Google وأعد الربط إذا انتهت الصلاحية.');
                } finally {
                    googleSyncInProgress = false;
                    if (googleSyncPending) {
                        googleSyncPending = false;
                        scheduleGoogleDriveSync();
                    }
                }
            }, 300);
        }

        async function syncGoogleDriveNow() {
            if (!googleAccessToken) {
                showToast('اربط حساب Google أولاً لتفعيل المزامنة', 'error');
                return;
            }
            try {
                await writeGoogleDriveBackup();

            }
        }

        function assignStudentMark(studentId, mark) {
            const student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const dateVal = document.getElementById('beh-filter-date').value || new Date().toISOString().split('T')[0];
            const subjectVal = document.getElementById('beh-filter-subject').value || '';
            if (!subjectVal || !isSubjectAssignedToStudentClass(subjectVal, student)) {
                showToast('المادة المختارة غير مرتبطة بمرحلة هذا الطالب وشعبته ونوع دراسته', 'error');
                return;
            }

            student.behavior = mark;
            if (!student.behaviorLog) student.behaviorLog = [];

            student.behaviorLog.push({
                mark: mark,
                stage: student.class,
                section: student.section,
                studyType: student.studyType || "صباحي",
                subject: subjectVal,
                date: dateVal
            });

            const badge = document.getElementById(`beh-badge-${student.id}`);
            if (badge) {
                badge.innerText = mark;
                badge.className = `text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${mark === 'مميز' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : mark === 'متوسط' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            }

            syncStateToCloud();
            showToast(`تم إضافة علامة (${mark}) للطالب ${student.name} بنجاح!`);
        }

        function deleteSavedSession(sessId) {
            if (!confirm("هل أنت متأكد من رغبتك في حذف جلسة الحضور هذه نهائياً؟")) return;
            const sessToDelete = appState.savedSessions.find(s => s.id === sessId);
            if (sessToDelete) {
                appState.students.forEach(st => {
                    if (st.absenceLog) {
                        st.absenceLog = st.absenceLog.filter(log => log.date !== sessToDelete.date);
                    }
                });
            }
            appState.savedSessions = appState.savedSessions.filter(s => s.id !== sessId);
            syncStateToCloud();
            showToast("تم حذف جلسة الحضور بنجاح!");
            renderContent();
        }

        function loadAttendanceList(editingSession = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const container = document.getElementById('attendance-list-container');

            if (!classVal) {
                showToast("الرجاء اختيار المرحلة أولاً", "error");
                return;
            }

            const { name: className, section: sectionPart, studyType: studyPart } = parseClassSelection(classVal);
            const section = sectionPart || "أ";
            const studyType = studyPart || "صباحي";
            if (!subjectVal || !isAssignedSubjectToClass(subjectVal, className, section, studyType)) {
                showToast("اختر مادة مرتبطة بالمرحلة والشعبة ونوع الدراسة المحددة", "error");
                return;
            }

            let filteredStudents = appState.students.filter(s => 
                s.class.trim() === className.trim() && 
                s.section.trim() === section.trim() && 
                (s.studyType || 'صباحي').trim() === studyType.trim()
            );

            filteredStudents = sortStudentsAlphabetically(filteredStudents);
            currentLoadedAttendanceStudents = filteredStudents;

            if (filteredStudents.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 text-center border border-slate-200/80">
                        <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>
                        <p class="text-xs text-slate-500 font-bold">لا يوجد طلبة مسجلين في (${className} - شعبة ${section} - ${studyType})</p>
                    </div>
                `;
                return;
            }

            currentAttendanceMap = {};
            filteredStudents.forEach(st => {
                if (editingSession && editingSession.records && (editingSession.records[st.id] !== undefined || editingSession.records[String(st.id)] !== undefined)) {
                    currentAttendanceMap[st.id] = editingSession.records[st.id] || editingSession.records[String(st.id)];
                } else {
                    currentAttendanceMap[st.id] = 'present';
                }
            });

            renderAttendanceRows(filteredStudents, className, section, studyType, subjectVal, editingSession ? editingSession.id : null);
        }

        function setSingleAttendanceStatus(studentId, status) {
            currentAttendanceMap[studentId] = status;
            currentAttendanceMap[String(studentId)] = status;

            if (!btnBox) return;
            const buttons = btnBox.querySelectorAll('button');
            if (buttons.length >= 3) {
                buttons[0].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
                buttons[1].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
                buttons[2].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}`;
            }
        }

        function setAllAttendanceStatus(status) {
            if (!currentLoadedAttendanceStudents || currentLoadedAttendanceStudents.length === 0) return;
            currentLoadedAttendanceStudents.forEach(st => {
                setSingleAttendanceStatus(st.id, status);
            });
            showToast(status === 'present' ? "تم تحديد جميع الطلبة كـ حاضر ✓" : "تم تحديد جميع الطلبة كـ غائب ✗");
        }

        function saveAttendanceRecord(editingSessionId = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const dateVal = document.getElementById('att-date-input').value;

            if (!classVal || !dateVal) {
                showToast("الرجاء اختيار المرحلة وتاريخ المحاضرة", "error");
                return;
            }

            const { name: className, section: sectionPart, studyType: studyPart } = parseClassSelection(classVal);
            const section = sectionPart || "أ";
            const studyType = studyPart || "صباحي";
            if (!subjectVal || !isAssignedSubjectToClass(subjectVal, className, section, studyType)) {
                showToast("لا يمكن حفظ الحضور لمادة غير مرتبطة بهذه المرحلة والشعبة والدراسة", "error");
                return;
            }
            const dayText = getDayName(dateVal);

            let cleanRecords = {};
            Object.keys(currentAttendanceMap).forEach(k => {
                cleanRecords[k] = currentAttendanceMap[k];
            });

            if (editingSessionId) {
                let sess = appState.savedSessions.find(s => s.id === editingSessionId);
                if (sess) {
                    sess.date = dateVal;
                    sess.className = className;
                    sess.section = section;
                    sess.studyType = studyType;
                    sess.subject = subjectVal;
                    sess.records = cleanRecords;
                }
            } else {
                let newSession = {
                    id: Date.now(),
                    date: dateVal,
                    className: className,
                    section: section,
                    studyType: studyType,
                    subject: subjectVal,
                    records: cleanRecords
                };
                appState.savedSessions.unshift(newSession);
            }

            currentLoadedAttendanceStudents.forEach(st => {
                let currentStudent = appState.students.find(s => s.id === st.id);
                if (!currentStudent) return;

                if (!currentStudent.absenceLog) currentStudent.absenceLog = [];
                currentStudent.absenceLog = currentStudent.absenceLog.filter(log => log.date !== dateVal);

                let stStatus = cleanRecords[st.id] || cleanRecords[String(st.id)] || 'present';

                if (stStatus === 'absent') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "غائب" });
                } else if (stStatus === 'excused') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "مجاز" });
                }

                let absCount = currentStudent.absenceLog.filter(l => l.status === 'غائب').length;
                let excCount = currentStudent.absenceLog.filter(l => l.status === 'مجاز').length;
                currentStudent.absenceCount = absCount;
                currentStudent.excusedCount = excCount;
                if (!currentStudent.attendanceCount) currentStudent.attendanceCount = 14;
                if (stStatus === 'present' && !editingSessionId) {
                    currentStudent.attendanceCount += 1;
                }
            });

            showToast("تم حفظ جلسة الحضور بنجاح وربطها مع التقارير!");
            syncStateToCloud();
            renderContent();
        }

        function editSavedSession(sessId) {
            let sess = appState.savedSessions.find(s => s.id === sessId);
            if (!sess) return;

            document.getElementById('att-class-select').value = `${sess.className} - ${sess.section} - ${sess.studyType || 'صباحي'}`;

        // --- Subject-aware report filters (used by all report categories) ---
        let activeReportKey = '';

        function normalizeReportValue(value) {
            return String(value == null ? '' : value).trim().toLocaleLowerCase('ar');
        }

        function getReportSubjectNames() {
            const names = new Set();
            (appState.subjectCatalog || []).forEach(item => { if (item && item.name) names.add(String(item.name).trim()); });
            (appState.subjects || []).forEach(item => { if (item && item.name) names.add(String(item.name).trim()); });
            (appState.students || []).forEach(student => {
                if (student && student.subject) names.add(String(student.subject).trim());
                (student && Array.isArray(student.behaviorLog) ? student.behaviorLog : []).forEach(log => {
                    if (log && log.subject) names.add(String(log.subject).trim());
                });
            });
            (appState.savedSessions || []).forEach(session => { if (session && session.subject) names.add(String(session.subject).trim()); });
            (appState.schedule || []).forEach(item => { if (item && item.subject) names.add(String(item.subject).trim()); });
            names.delete('');
            return Array.from(names).sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getSelectedReportSubject() {
            const select = document.getElementById('rep-subject-filter');
            return select ? select.value : 'all';
        }

        function getReportClassParts(classFilterVal = 'all') {
            if (!classFilterVal || classFilterVal === 'all') return null;
            const parts = String(classFilterVal).split(' - ');
            return {
                name: (parts[0] || '').trim(),
                section: (parts[1] || '').trim(),
                studyType: (parts.slice(2).join(' - ') || 'صباحي').trim()
            };
        }

        function reportStudentMatchesClass(student, classFilterVal = 'all') {
            const parts = getReportClassParts(classFilterVal);
            if (!parts) return true;
            return normalizeReportValue(student && student.class) === normalizeReportValue(parts.name) &&
                normalizeReportValue(student && student.section) === normalizeReportValue(parts.section) &&
                normalizeReportValue((student && student.studyType) || 'صباحي') === normalizeReportValue(parts.studyType || 'صباحي');
        }

        function reportClassMatchesSession(session, classFilterVal) {
            const parts = getReportClassParts(classFilterVal);
            if (!parts) return true;
            return normalizeReportValue(session && session.className) === normalizeReportValue(parts.name) &&
                normalizeReportValue(session && session.section) === normalizeReportValue(parts.section) &&
                normalizeReportValue((session && session.studyType) || 'صباحي') === normalizeReportValue(parts.studyType || 'صباحي');
        }

        function reportSessionMatchesStudent(session, student) {
            return normalizeReportValue(session && session.className) === normalizeReportValue(student && student.class) &&
                normalizeReportValue(session && session.section) === normalizeReportValue(student && student.section) &&
                normalizeReportValue((session && session.studyType) || 'صباحي') === normalizeReportValue((student && student.studyType) || 'صباحي');
        }

        // يربط الطالب بالمادة عبر قائمة المواد، وبيانات الطالب، وسجلات المتابعة القديمة.
        // وجود مادة مرتبطة بمرحلة/شعبة يتيح عرض جميع طلبة تلك الشعبة في تقرير المادة.
        function reportSubjectMatchesStudent(student, subjectName) {
            if (!subjectName || subjectName === 'all') return true;
            const wanted = normalizeReportValue(subjectName);
            const directSubjectMatch = normalizeReportValue(student && student.subject) === wanted;
            const behaviorLogs = student && Array.isArray(student.behaviorLog) ? student.behaviorLog : [];
            const behaviorMatch = behaviorLogs.some(log => normalizeReportValue(log && log.subject) === wanted);
            const linkedSubjectRecords = (appState.subjects || []).filter(item => normalizeReportValue(item && item.name) === wanted);
            const classLinkMatch = linkedSubjectRecords.some(item => {
                if (item.class && normalizeReportValue(item.class) !== normalizeReportValue(student && student.class)) return false;
                if (item.section && normalizeReportValue(item.section) !== normalizeReportValue(student && student.section)) return false;
                if (item.studyType && normalizeReportValue(item.studyType) !== normalizeReportValue((student && student.studyType) || 'صباحي')) return false;
                return Boolean(item.class);
            });
            // عند وجود ربط صريح للمادة بمرحلة/شعبة، تكون القائمة المرجع الأساسي.
            // أما سجلات المواد القديمة التي لا تحدد مرحلة، فتستخدم ربط الطالب وسجل المتابعة.
            const hasExplicitRoster = linkedSubjectRecords.some(item => String(item.class || '').trim());
            return hasExplicitRoster ? classLinkMatch : (directSubjectMatch || behaviorMatch);
        }

        function getSubjectSessions(subjectName, classFilterVal = 'all', fromDate = '', toDate = '') {
            return (appState.savedSessions || []).filter(session =>
                (!subjectName || subjectName === 'all' || normalizeReportValue(session && session.subject) === normalizeReportValue(subjectName)) &&
                reportClassMatchesSession(session, classFilterVal) &&
                (!fromDate || String(session.date || '') >= fromDate) &&
                (!toDate || String(session.date || '') <= toDate)
            );
        }

        function getReportSessionsForStudent(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            return getSubjectSessions(subjectName, classFilterVal, fromDate, toDate).filter(session => reportSessionMatchesStudent(session, student));
        }

        function createAttendanceMetrics(attendanceCount = 0, absentCount = 0, excusedCount = 0, attendanceLogs = [], flags = {}) {
            const logs = Array.isArray(attendanceLogs) ? attendanceLogs : [];
            const absenceLogs = logs.filter(log => log && log.status === 'غائب');
            const excusedLogs = logs.filter(log => log && log.status === 'مجاز');
            const safeAttendance = Math.max(0, Number(attendanceCount) || 0);
            const safeAbsent = Math.max(0, Number(absentCount) || 0);
            const safeExcused = Math.max(0, Number(excusedCount) || 0);
            const totalLectures = safeAttendance + safeAbsent + safeExcused;
            const seenDates = new Set();
            const absenceDates = absenceLogs.map(log => `${log.day ? log.day + ' ' : ''}${log.date || ''}`.trim()).filter(Boolean).filter(date => {
                if (seenDates.has(date)) return false;
                seenDates.add(date);
                return true;
            });
            return {
                attendanceCount: safeAttendance,
                absentCount: safeAbsent,
                excusedCount: safeExcused,
                totalLectures,
                absenceRate: totalLectures ? safeAbsent / totalLectures * 100 : 0,
                absenceLogs,
                attendanceLogs: logs,
                absenceDates,
                hasSubjectRecords: Boolean(flags.hasSubjectRecords),
                hasSessionRecords: Boolean(flags.hasSessionRecords),
                hasApplicableSessions: Boolean(flags.hasApplicableSessions)
            };
        }

        function getReportSessionMetrics(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            const sessions = getReportSessionsForStudent(student, subjectName, classFilterVal, fromDate, toDate);
            let attendanceCount = 0, absentCount = 0, excusedCount = 0;
            let hasStudentRecord = false;
            const logs = [];
            sessions.forEach(session => {
                const records = session.records || {};
                const key = String(student && student.id);
                if (!Object.prototype.hasOwnProperty.call(records, key) || !records[key]) return;
                hasStudentRecord = true;
                const code = String(records[key]).toLowerCase();
                if (code === 'absent') {
                    absentCount++;
                    logs.push({ date: session.date || '', day: getDayName(session.date), status: 'غائب' });
                } else if (code === 'excused') {
                    excusedCount++;
                    logs.push({ date: session.date || '', day: getDayName(session.date), status: 'مجاز' });
                } else {
                    attendanceCount++;
                }
            });
            return createAttendanceMetrics(attendanceCount, absentCount, excusedCount, logs, {
                hasSubjectRecords: hasStudentRecord,
                hasSessionRecords: hasStudentRecord,
                hasApplicableSessions: sessions.length > 0
            });
        }

        function filterStudentsForReportSubject(students, subjectName = getSelectedReportSubject()) {
            if (!subjectName || subjectName === 'all') return students;
            return students.filter(student => reportSubjectMatchesStudent(student, subjectName));
        }

        function filterStudentsForAttendanceSubject(students, subjectName = getSelectedReportSubject(), classFilterVal = 'all', fromDate = '', toDate = '') {
            if (!subjectName || subjectName === 'all') return students;
            const sessions = getSubjectSessions(subjectName, classFilterVal, fromDate, toDate);
            const recordedIds = new Set();
            sessions.forEach(session => {
                Object.keys(session.records || {}).forEach(id => recordedIds.add(String(id)));
            });
            return students.filter(student => recordedIds.has(String(student.id)) || reportSubjectMatchesStudent(student, subjectName));
        }

        function getStudentStatusForReportDate(student, dateValue, subjectName = 'all', classFilterVal = 'all') {
            const sessions = getReportSessionsForStudent(student, subjectName, classFilterVal, dateValue, dateValue);
            const statuses = [];
            sessions.forEach(session => {
                const records = session.records || {};
                const key = String(student && student.id);
                if (!Object.prototype.hasOwnProperty.call(records, key) || !records[key]) return;
                const code = String(records[key]).toLowerCase();
                statuses.push(code === 'absent' ? 'غائب' : code === 'excused' ? 'مجاز' : 'حاضر');
            });
            if (statuses.length) {
                if (statuses.includes('غائب')) return 'غائب';
                if (statuses.includes('مجاز')) return 'مجاز';
                return 'حاضر';
            }
            if (sessions.length) return 'غير مسجل';

            const studentSubjectMatches = !subjectName || subjectName === 'all' ||
                normalizeReportValue(student && student.subject) === normalizeReportValue(subjectName);
            if (studentSubjectMatches) {
                const log = (student && Array.isArray(student.absenceLog) ? student.absenceLog : []).find(item => item && item.date === dateValue);
                if (log) return log.status || 'غير مسجل';
            }
            return 'غير مسجل';
        }

        function getLegacyStudentAttendanceMetrics(student, fromDate = '', toDate = '') {
            const allLogs = Array.isArray(student && student.absenceLog) ? student.absenceLog.filter(Boolean) : [];
            const logs = allLogs.filter(log => (!fromDate || String(log.date || '') >= fromDate) && (!toDate || String(log.date || '') <= toDate));
            const absenceLogs = logs.filter(log => log.status === 'غائب');
            const excusedLogs = logs.filter(log => log.status === 'مجاز');
            const isPeriodReport = Boolean(fromDate || toDate);
            const absentCount = isPeriodReport ? absenceLogs.length : Math.max(Number(student && student.absenceCount) || 0, absenceLogs.length);
            const excusedCount = isPeriodReport ? excusedLogs.length : Math.max(Number(student && student.excusedCount) || 0, excusedLogs.length);
            const attendanceCount = isPeriodReport ? 0 : (Number(student && student.attendanceCount) || 0);
            return createAttendanceMetrics(attendanceCount, absentCount, excusedCount, [...absenceLogs, ...excusedLogs], {});
        }

        function getSubjectAttendanceMetrics(student, subjectName, classFilterVal = 'all', fromDate = '', toDate = '') {
            const sessionMetrics = getReportSessionMetrics(student, subjectName, classFilterVal, fromDate, toDate);
            if (sessionMetrics.hasApplicableSessions) return sessionMetrics;
            // إذا لم توجد جلسات للمادة، لا نخلط أرقام مادة أخرى بها. نستخدم السجل القديم فقط عند ارتباط الطالب المباشر بالمادة.
            if (normalizeReportValue(student && student.subject) === normalizeReportValue(subjectName)) {
                return getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
            }
            return createAttendanceMetrics(0, 0, 0, [], { hasSubjectRecords: false, hasSessionRecords: false, hasApplicableSessions: false });
        }

        // تحديث المستطيل في متن الورقة ليتضمن نوع الدراسة بجانب المرحلة والشعبة والمادة
        function setPrintHeaderStageLabelUnified(elemId, classVal) {
            const stageEl = document.getElementById(`${elemId}-strip-stage`);
            const secEl = document.getElementById(`${elemId}-strip-section`);
            const studyEl = document.getElementById(`${elemId}-strip-study`);
            const subjEl = document.getElementById(`${elemId}-strip-subject`);

            if (!stageEl || !secEl || !studyEl || !subjEl) return;

            if (classVal === 'all' || !classVal) {
                stageEl.innerText = "المرحلة: جميع المراحل";
                secEl.innerText = "الشعبة: جميع الشعب";
                studyEl.innerText = "نوع الدراسة: جميع الدراسات";
                const selectedSubject = getSelectedReportSubject();
                subjEl.innerText = `المادة: ${selectedSubject === 'all' ? 'جميع المواد الدراسية' : selectedSubject}`;
            } else {
                const parts = classVal.split(' - ');
                const cName = parts[0] ? parts[0].trim() : '';
                const sSec = parts[1] ? parts[1].trim() : '';
                const sStudy = parts[2] ? parts[2].trim() : 'صباحي';

                stageEl.innerText = `المرحلة: ${cName}`;
                secEl.innerText = `الشعبة: ${sSec}`;
                studyEl.innerText = `نوع الدراسة: ${sStudy}`;
                const selectedSubject = getSelectedReportSubject();
                subjEl.innerText = `المادة: ${selectedSubject === 'all' ? 'جميع المواد الدراسية' : selectedSubject}`;
            }
        }

        // 1. تقرير قائمة الغياب والمجازين
        function updateAbsenceListReport() {
            const dateVal = document.getElementById('rep-abs-date').value;
            const classFilterVal = document.getElementById('rep-abs-class').value;
            const searchKey = getSearchKeyword();
            const selectedSubject = getSelectedReportSubject();

            setPrintHeaderStageLabelUnified('rep-abs-stage', classFilterVal);
            let filtered = [...appState.students];
            if (classFilterVal !== 'all') filtered = filtered.filter(student => reportStudentMatchesClass(student, classFilterVal));
            filtered = filterStudentsForAttendanceSubject(filtered, selectedSubject, classFilterVal, dateVal, dateVal);

            let presentCount = 0, absentCount = 0, excusedCount = 0;
            let targetStudents = [];
            filtered.forEach(student => {
                const status = getStudentStatusForReportDate(student, dateVal, selectedSubject, classFilterVal);
                if (status === 'حاضر') presentCount++;
                else if (status === 'غائب') {
                    absentCount++;
                    targetStudents.push({ ...student, currentStatus: 'غائب' });
                } else if (status === 'مجاز') {
                    excusedCount++;
                    targetStudents.push({ ...student, currentStatus: 'مجاز' });
                }
            });

            const statsBox = document.getElementById('absence-stats-box');
            if (statsBox) statsBox.innerHTML = `
                <div class="p-2.5 bg-emerald-50 rounded-2xl border border-emerald-200"><span class="block text-emerald-700 text-lg font-black">${presentCount}</span><span class="text-[10px] text-slate-500 font-bold">عدد الحضور</span></div>
                <div class="p-2.5 bg-rose-50 rounded-2xl border border-rose-200"><span class="block text-rose-700 text-lg font-black">${absentCount}</span><span class="text-[10px] text-slate-500 font-bold">عدد الغياب</span></div>
                <div class="p-2.5 bg-amber-50 rounded-2xl border border-amber-200"><span class="block text-amber-700 text-lg font-black">${excusedCount}</span><span class="text-[10px] text-slate-500 font-bold">عدد المجازين</span></div>
            `;

            if (searchKey) targetStudents = targetStudents.filter(student => String(student.name || '').toLowerCase().includes(searchKey));
            targetStudents = sortStudentsAlphabetically(targetStudents);
            const rows = targetStudents.map((student, index) => `
                <tr class="border-b border-slate-100 text-[11px]">
                    <td class="p-2 font-bold text-center">${index + 1}</td>
                    <td class="p-2 font-bold text-slate-800">${student.name}</td>
                    <td class="p-2 text-center"><span class="px-3 py-0.5 rounded-full text-[10px] font-black ${student.currentStatus === 'غائب' ? 'bg-rose-100 text-rose-800 border border-rose-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}">${student.currentStatus}</span></td>
                </tr>
            `).join('');
            document.getElementById('absence-list-report-body').innerHTML = rows || '<tr><td colspan="3" class="p-4 text-center text-xs font-bold text-emerald-600">لا يوجد أي طلاب غائبين أو مجازين مسجلين في هذا التاريخ</td></tr>';
        }

        // 3. تقرير الحضور الشهري
        function updateMonthlyAttReport() {
            const classFilterVal = document.getElementById('rep-month-class').value;
            const fromDate = document.getElementById('rep-month-from').value;
            const toDate = document.getElementById('rep-month-to').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabelUnified('rep-month-stage', classFilterVal);

            let filtered = [...appState.students];
            if (classFilterVal !== 'all') filtered = filtered.filter(student => reportStudentMatchesClass(student, classFilterVal));
            if (searchKey) filtered = filtered.filter(student => String(student.name || '').toLowerCase().includes(searchKey));
            filtered = filterStudentsForAttendanceSubject(filtered, getSelectedReportSubject(), classFilterVal, fromDate, toDate);
            filtered = sortStudentsAlphabetically(filtered);

            const selectedSubject = getSelectedReportSubject();
            const rows = filtered.map((student, index) => {
                let metrics;
                const sessionMetrics = getReportSessionMetrics(student, selectedSubject, classFilterVal, fromDate, toDate);
                if (sessionMetrics.hasApplicableSessions) {
                    metrics = sessionMetrics;
                } else if ((appState.savedSessions || []).length === 0) {
                    metrics = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                } else if (selectedSubject !== 'all' && normalizeReportValue(student.subject) === normalizeReportValue(selectedSubject)) {
                    metrics = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                } else {
                    // لا تُعرض الأعداد التراكمية وكأنها تخص الفترة المحددة.
                    const logs = (Array.isArray(student.absenceLog) ? student.absenceLog : []).filter(log => log &&
                        (!fromDate || String(log.date || '') >= fromDate) && (!toDate || String(log.date || '') <= toDate));
                    metrics = createAttendanceMetrics(0, logs.filter(log => log.status === 'غائب').length,
                        logs.filter(log => log.status === 'مجاز').length,
                        logs.filter(log => log.status === 'غائب' || log.status === 'مجاز'), {});
                }
                const total = metrics.totalLectures || 0;
                const rate = total ? Math.round((metrics.attendanceCount / total) * 100) : 0;
                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 font-bold text-center">${index + 1}</td>
                        <td class="p-2 font-bold text-slate-800">${student.name}</td>
                        <td class="p-2 text-center font-black text-emerald-600">${metrics.attendanceCount}</td>
                        <td class="p-2 text-center font-black text-rose-600">${metrics.absentCount}</td>
                        <td class="p-2 text-center font-black text-amber-600">${metrics.excusedCount}</td>
                        <td class="p-2 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${rate >= 85 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${rate}%</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('att-monthly-report-body').innerHTML = rows || '<tr><td colspan="6" class="p-3 text-center text-xs text-slate-400">لا يوجد طلبة مطابقين للشروط</td></tr>';
        }

        // 5. تقرير المتابعة
        function updateBehaviorReport() {
            const classFilterVal = document.getElementById('rep-beh-class').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabelUnified('rep-beh-stage', classFilterVal);

            let filtered = [...appState.students];
            if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            if (searchKey) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchKey));
            }

            filtered = filterStudentsForReportSubject(filtered);
            filtered = sortStudentsAlphabetically(filtered);

            let rows = filtered.map((s, i) => {
                let excellentCount = 0;
                let averageCount = 0;
                let poorCount = 0;

                const reportSubject = getSelectedReportSubject();
                const allBehaviorLogs = Array.isArray(s.behaviorLog) ? s.behaviorLog : [];
                const relevantBehaviorLogs = reportSubject === 'all'
                    ? allBehaviorLogs
                    : allBehaviorLogs.filter(log => normalizeReportValue(log && log.subject) === normalizeReportValue(reportSubject));
                if (relevantBehaviorLogs.length > 0) {
                    relevantBehaviorLogs.forEach(log => {
                        if (log.mark === 'مميز') excellentCount++;
                        else if (log.mark === 'متوسط') averageCount++;
                        else if (log.mark === 'سيء') poorCount++;
                    });
                } else if (reportSubject === 'all' || normalizeReportValue(s.subject) === normalizeReportValue(reportSubject)) {
                    if (s.behavior === 'مميز') excellentCount = 1;
                    else if (s.behavior === 'متوسط') averageCount = 1;
                    else if (s.behavior === 'سيء') poorCount = 1;
                }

                let badgeClass = s.behavior === 'مميز' ? 'bg-emerald-100 text-emerald-800' : s.behavior === 'متوسط' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800';

                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 font-bold text-center">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800">${s.name}</td>
                        <td class="p-2 text-center text-emerald-400 font-black">${excellentCount}</td>
                        <td class="p-2 text-center text-amber-400 font-black">${averageCount}</td>
                        <td class="p-2 text-center text-rose-400 font-black">${poorCount}</td>
                        <td class="p-2 text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeClass}">
                                ${s.behavior || 'غير محدد'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('behavior-report-body').innerHTML = rows || '<tr><td colspan="6" class="p-3 text-center text-xs text-slate-400">لا يوجد طلبة مطابقين للشروط</td></tr>';
        }

        // إحصائيات التقارير: الأولوية لجلسات الحضور المحفوظة، مع دعم سجلات الطلبة القديمة.
        function getStudentAbsenceMetrics(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            const pickedSubject = subjectName || 'all';
            const sessionMetrics = getReportSessionMetrics(student, pickedSubject, classFilterVal, fromDate, toDate);

            if (pickedSubject !== 'all') {
                if (sessionMetrics.hasApplicableSessions) return sessionMetrics;
                if (normalizeReportValue(student && student.subject) === normalizeReportValue(pickedSubject)) {
                    return getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                }
                return sessionMetrics;
            }

            const legacy = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
            if (fromDate || toDate) {
                if (sessionMetrics.hasApplicableSessions) {
                    // سجلات الغياب القديمة تُدمج مع الجلسات دون تكرار نفس الحالة في التاريخ نفسه.
                    const mergedLogs = [...sessionMetrics.attendanceLogs];
                    legacy.attendanceLogs.forEach(log => {
                        if (!mergedLogs.some(existing => existing.date === log.date && existing.status === log.status)) mergedLogs.push(log);
                    });
                    return createAttendanceMetrics(sessionMetrics.attendanceCount,
                        Math.max(sessionMetrics.absentCount, mergedLogs.filter(log => log.status === 'غائب').length),
                        Math.max(sessionMetrics.excusedCount, mergedLogs.filter(log => log.status === 'مجاز').length),
                        mergedLogs, { hasSessionRecords: sessionMetrics.hasSessionRecords, hasApplicableSessions: true });
                }
                if ((appState.savedSessions || []).length === 0) return legacy;
                return createAttendanceMetrics(0, legacy.absentCount, legacy.excusedCount, legacy.attendanceLogs, {});
            }

            if (!sessionMetrics.hasApplicableSessions && !sessionMetrics.hasSessionRecords) return legacy;
            const mergedLogs = [...sessionMetrics.attendanceLogs];
            legacy.attendanceLogs.forEach(log => {
                if (!mergedLogs.some(existing => existing.date === log.date && existing.status === log.status)) mergedLogs.push(log);
            });
            return createAttendanceMetrics(
                Math.max(legacy.attendanceCount, sessionMetrics.attendanceCount),
                Math.max(legacy.absentCount, sessionMetrics.absentCount, mergedLogs.filter(log => log.status === 'غائب').length),
                Math.max(legacy.excusedCount, sessionMetrics.excusedCount, mergedLogs.filter(log => log.status === 'مجاز').length),
                mergedLogs,
                { hasSessionRecords: sessionMetrics.hasSessionRecords, hasApplicableSessions: sessionMetrics.hasApplicableSessions }
            );
        }

        function renderAllStudentsAttendanceReport() {
            const classFilterVal = document.getElementById('rep-att-st-class').value;
            const container = document.getElementById('rep-att-st-details');
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabelUnified('rep-att-st-stage', classFilterVal);

            let filtered = [...appState.students];
            if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            if (searchKey) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchKey));
            }

            filtered = filterStudentsForAttendanceSubject(filtered, getSelectedReportSubject(), classFilterVal);

            filtered = sortStudentsAlphabetically(filtered);

            let rows = filtered.map((s, i) => {
                const pickedSubject = getSelectedReportSubject();
                const metrics = getStudentAbsenceMetrics(s, pickedSubject, classFilterVal);
                let absenceDates = (metrics.absenceDates || [])
                    .map(date => date)
                    .join(' ، ');

                if (!absenceDates && (metrics.absentCount || 0) === 0) {
                    absenceDates = '<span class="text-emerald-700 font-bold">لا يوجد غياب (ملتزم)</span>';
                } else if (!absenceDates && (metrics.absentCount || 0) > 0) {
                    absenceDates = `<span class="text-rose-700 font-bold">${metrics.absentCount} غيابات مسجلة</span>`;
                }

                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 text-center font-bold">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800 whitespace-nowrap">${s.name}</td>
                        <td class="p-2 text-center font-black text-rose-700 whitespace-nowrap">${metrics.absentCount || 0}</td>
                        <td class="p-2 text-center font-black text-amber-700 whitespace-nowrap">${metrics.excusedCount || 0}</td>
                        <td class="p-2 text-center font-black text-emerald-700 whitespace-nowrap">${metrics.attendanceCount || 0}</td>
                        <td class="p-2 text-slate-700 leading-relaxed font-medium">${absenceDates}</td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `

                    <table class="w-full text-right">
                        <thead class="bg-slate-900 text-amber-400 text-[10px]">
                            <tr>

        function saveUpdatedClassItem(classId) {
            let cls = appState.classes.find(c => c.id === classId);
            if (!cls) return;

            let newName = document.getElementById('edit-cls-name').value.trim();
            let newSec = document.getElementById('edit-cls-section').value.trim();
            let newStudy = document.getElementById('edit-cls-study').value || 'صباحي';
            let subjectNames = document.getElementById('edit-cls-subjects') ? document.getElementById('edit-cls-subjects').value : '';

            if (!newName || !newSec) {
                showToast("الرجاء ملء اسم المرحلة والشعبة", "error");
                return;
            }
            const duplicate = appState.classes.some(other => other.id !== classId &&
                normalizeAcademicText(other.name) === normalizeAcademicText(newName) &&
                normalizeAcademicText(other.section) === normalizeAcademicText(newSec) &&
                normalizeAcademicText(other.studyType || 'صباحي') === normalizeAcademicText(newStudy));
            if (duplicate) {
                showToast("هذه المرحلة والشعبة ونوع الدراسة مسجلة مسبقاً", "error");
                return;
            }

            const oldIdentity = { name: cls.name, section: cls.section, studyType: cls.studyType || 'صباحي' };
            const isOldIdentity = item => normalizeAcademicText(item.class) === normalizeAcademicText(oldIdentity.name) &&
                normalizeAcademicText(item.section) === normalizeAcademicText(oldIdentity.section) &&
                normalizeAcademicText(item.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType);

            cls.name = newName;
            cls.section = newSec;
            cls.studyType = newStudy;

            appState.students.forEach(student => {
                if (normalizeAcademicText(student.class) === normalizeAcademicText(oldIdentity.name) &&
                    normalizeAcademicText(student.section) === normalizeAcademicText(oldIdentity.section) &&
                    normalizeAcademicText(student.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType)) {
                    student.class = newName;
                    student.section = newSec;
                    student.studyType = newStudy;
                }
            });

            appState.subjects.forEach(subject => {
                if (isOldIdentity(subject)) {
                    subject.class = newName;
                    subject.section = newSec;
                    subject.studyType = newStudy;
                }
            });

            appState.savedSessions.forEach(session => {
                if (normalizeAcademicText(session.className) === normalizeAcademicText(oldIdentity.name) &&
                    normalizeAcademicText(session.section) === normalizeAcademicText(oldIdentity.section) &&
                    normalizeAcademicText(session.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType)) {
                    session.className = newName;
                    session.section = newSec;
                    session.studyType = newStudy;
                }
            });

            const oldScheduleName = `${oldIdentity.name} (${oldIdentity.section} - ${oldIdentity.studyType})`;
            const newScheduleName = `${newName} (${newSec} - ${newStudy})`;
            appState.schedule.forEach(item => {
                if (String(item.className || '').trim() === oldScheduleName) item.className = newScheduleName;
            });

            applyClassSubjectNames(cls, subjectNames);
            syncStateToCloud();
            showToast("تم تعديل المرحلة والشعبة والدراسة والمواد المرتبطة بها بنجاح!");
            triggerAction('add_class');
            updateStatsBar();
            renderContent();
        }

        function deleteClassItem(classId) {
            if (!confirm("هل أنت متأكد من رغبتك في حذف هذه المرحلة والشعبة؟")) return;
            const deletedClass = appState.classes.find(c => c.id === classId);
            if (deletedClass) {
                appState.subjects = appState.subjects.filter(subject =>
                    !(normalizeAcademicText(subject.class) === normalizeAcademicText(deletedClass.name) &&
                      normalizeAcademicText(subject.section) === normalizeAcademicText(deletedClass.section) &&
                      normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(deletedClass.studyType || 'صباحي'))
                );
                const deletedScheduleName = `${deletedClass.name} (${deletedClass.section} - ${deletedClass.studyType || 'صباحي'})`;
                appState.schedule = appState.schedule.filter(item => String(item.className || '').trim() !== deletedScheduleName);
            }
            appState.classes = appState.classes.filter(c => c.id !== classId);
            syncStateToCloud();
            showToast("تم حذف المرحلة والشعبة والمواد المرتبطة بها بنجاح!");
            triggerAction('add_class');
            updateStatsBar();
            renderContent();
        }

        function normalizeStudentSearchText(value) {
            return String(value || '')
                .toLocaleLowerCase('ar')
                .normalize('NFD')
                .replace(/[\u064B-\u065F\u0670]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .trim();
        }
