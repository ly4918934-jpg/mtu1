        // --- Supabase Cloud Database Realtime Engine ---
        function initSupabase() {
            const savedUrl = localStorage.getItem('sp_supabase_url') || appState.supabaseConfig.url;
            const savedKey = localStorage.getItem('sp_supabase_key') || appState.supabaseConfig.key;

            if (savedUrl && savedKey) {
                try {
                    supabaseClient = supabase.createClient(savedUrl, savedKey);
                    appState.supabaseConfig.url = savedUrl;
                    appState.supabaseConfig.key = savedKey;
                    testSupabaseConnection(false);
                } catch(e) {
                    console.error("Supabase Init Error:", e);
                    setSupabaseStatus(false);
                }
            } else {
                setSupabaseStatus(false);
            }
        }

        async function testSupabaseConnection(showAlert = true) {
            if (!supabaseClient) {
                setSupabaseStatus(false);
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('professor_data')
                    .select('data')
                    .eq('id', 'main_academic_state')
                    .single();

                if (error && error.code !== 'PGRST116') {
                    throw error;
                }

                setSupabaseStatus(true);
                if (data && data.data) {
                    const cloudConfig = appState.supabaseConfig;
                    appState = data.data;
                    appState.supabaseConfig = cloudConfig;
                    renderContent();
                    updateStatsBar();
                }
                if (showAlert) showToast("تم الاتصال بقاعدة بيانات Supabase بنجاح!");
            } catch(err) {
                console.error("Supabase Error:", err);
                setSupabaseStatus(false);
                if (showAlert) showToast("فشل الاتصال: تأكد من إنشاء جدول professor_data في Supabase", "error");
            }
        }

        function setSupabaseStatus(isConnected) {
            appState.supabaseConfig.connected = isConnected;
            const badge = document.getElementById('supabase-status-badge');
            const dot = document.getElementById('supabase-status-dot');
            const text = document.getElementById('supabase-status-text');

            if (!badge || !dot || !text) return;

            if (isConnected) {
                badge.className = "text-[10px] bg-emerald-500/20 border border-emerald-500/40 px-2.5 py-1 rounded-full text-emerald-300 font-black backdrop-blur-md flex items-center gap-1.5 shadow-sm transition-all duration-300";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                text.innerText = "سحابي متصل ✓";
            } else {
                badge.className = "text-[10px] bg-rose-500/20 border border-rose-500/40 px-2.5 py-1 rounded-full text-rose-300 font-black backdrop-blur-md flex items-center gap-1.5 shadow-sm transition-all duration-300";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.innerText = "سحابي غير متصل";
            }
        }

        // حفظ لحظي تلقائي لكل عملية في التطبيق
        async function syncStateToCloud() {
            localStorage.setItem('sp_academic_local_data', JSON.stringify(appState));

            if (!supabaseClient || !appState.supabaseConfig.connected) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('professor_data')
                    .upsert({
                        id: 'main_academic_state',
                        data: appState,
                        updated_at: new Date().toISOString()
                    });

                if (error) throw error;
            } catch (err) {
                console.warn("Realtime cloud sync error:", err);
                setSupabaseStatus(false);
            }
        }

                                <span>متوسط</span>

        async function assignStudentMark(studentId, mark) {
            const student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const dateVal = document.getElementById('beh-filter-date').value || new Date().toISOString().split('T')[0];
            const subjectVal = document.getElementById('beh-filter-subject').value || "عام";

            student.behavior = mark;
            if (!student.behaviorLog) student.behaviorLog = [];

            student.behaviorLog.push({
                mark: mark,
                stage: student.class,
                section: student.section,
                subject: subjectVal,
                date: dateVal
            });

            const badge = document.getElementById(`beh-badge-${student.id}`);
            if (badge) {
                badge.innerText = mark;
                badge.className = `text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${mark === 'مميز' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : mark === 'متوسط' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            }

            await syncStateToCloud();
            showToast(`تم إضافة علامة (${mark}) للطالب ${student.name} بنجاح!`);
        }

        function loadAttendanceList(editingSession = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const container = document.getElementById('attendance-list-container');

            if (!classVal) {
                showToast("الرجاء اختيار المرحلة أولاً", "error");
                return;
            }

            const [className, sectionPart] = classVal.split(" - ");
            const section = sectionPart || "أ";

            let filteredStudents = appState.students.filter(s => s.class.trim() === className.trim() && s.section.trim() === section.trim());
            filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

            if (filteredStudents.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 text-center border border-slate-200/80">
                        <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>
                        <p class="text-xs text-slate-500 font-bold">لا يوجد طلبة مسجلين في (${className} - شعبة ${section})</p>
                    </div>
                `;
                return;
            }

            currentAttendanceMap = {};
            filteredStudents.forEach(st => {
                if (editingSession && editingSession.records && editingSession.records[st.id]) {
                    currentAttendanceMap[st.id] = editingSession.records[st.id];
                } else {
                    currentAttendanceMap[st.id] = 'present';
                }
            });

            renderAttendanceRows(filteredStudents, className, section, subjectVal, editingSession ? editingSession.id : null);
        }

        function renderAttendanceRows(students, className, section, subjectVal, sessionId = null) {
            const container = document.getElementById('attendance-list-container');
            let listHtml = `
                <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                        <div>
                            <h4 class="font-black text-slate-800 text-xs">${sessionId ? 'تعديل جلسة حُفظت سابقًا' : 'سجل الحضور والغياب اليومي'}</h4>
                            <p class="text-[10px] text-slate-400">${className} (${section}) | ${subjectVal}</p>
                        </div>
                        <span class="text-[10px] bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-bold">${students.length} طالب</span>
                    </div>

                    <div class="flex gap-2 mb-3">
                        <button onclick="setAllAttendanceStatus('present')" class="flex-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 py-1.5 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                            <i class="fa-solid fa-check-double"></i>
                            <span>تحديد الكل حاضر</span>
                        </button>
                        <button onclick="setAllAttendanceStatus('absent')" class="flex-1 bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 py-1.5 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                            <i class="fa-solid fa-xmark"></i>
                            <span>تحديد الكل غائب</span>
                        </button>
                    </div>

                    <div class="space-y-2">
            `;

            students.forEach((st, idx) => {
                let status = currentAttendanceMap[st.id] || 'present';
                listHtml += `
                    <div class="flex items-center justify-between bg-slate-50/80 p-2 rounded-2xl border border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold flex items-center justify-center">${idx + 1}</span>

                                <h5 class="font-bold text-slate-800 text-xs">${st.name}</h5>
                            </div>
                        </div>
                        <div class="flex gap-1" id="att-btns-${st.id}">
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'present')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}">حاضر</button>
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'absent')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}">غائب</button>
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'excused')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}">مجاز</button>
                        </div>
                    </div>
                `;
            });

            listHtml += `
                    </div>
                    <button onclick="saveAttendanceRecord(${sessionId})" class="w-full mt-3.5 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700 transition-colors flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>${sessionId ? 'تحديث وحفظ الجلسة المعدلة' : 'حفظ وتسجيل المحاضرة'}</span>
                    </button>
                </div>
            `;

            container.innerHTML = listHtml;
        }

        function setSingleAttendanceStatus(studentId, status) {
            currentAttendanceMap[studentId] = status;
            const btnBox = document.getElementById(`att-btns-${studentId}`);
            if (!btnBox) return;
            const buttons = btnBox.querySelectorAll('button');
            buttons[0].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
            buttons[1].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
            buttons[2].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}`;
        }

        function setAllAttendanceStatus(status) {
            Object.keys(currentAttendanceMap).forEach(stId => {
                setSingleAttendanceStatus(parseInt(stId), status);
            });
            showToast(status === 'present' ? "تم تحديد جميع الطلبة كـ حاضر" : "تم تحديد جميع الطلبة كـ غائب");
        }

        async function saveAttendanceRecord(editingSessionId = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const dateVal = document.getElementById('att-date-input').value;

            const [className, sectionPart] = classVal.split(" - ");
            const section = sectionPart || "أ";

            if (editingSessionId) {
                let sess = appState.savedSessions.find(s => s.id === editingSessionId);
                if (sess) {
                    sess.date = dateVal;
                    sess.className = className;
                    sess.section = section;
                    sess.subject = subjectVal;
                    sess.records = { ...currentAttendanceMap };
                }
                showToast("تم تحديث الجلسة المحفوظة بنجاح!");
            } else {
                let newSession = {
                    id: Date.now(),
                    date: dateVal,
                    className: className,
                    section: section,
                    subject: subjectVal,
                    records: { ...currentAttendanceMap }
                };
                appState.savedSessions.unshift(newSession);

                Object.keys(currentAttendanceMap).forEach(stId => {
                    let st = appState.students.find(s => s.id === parseInt(stId));
                    if (st) {
                        let stStatus = currentAttendanceMap[stId];
                        if (stStatus === 'present') st.attendanceCount = (st.attendanceCount || 0) + 1;
                        else if (stStatus === 'absent') {
                            st.absenceCount = (st.absenceCount || 0) + 1;
                            if (!st.absenceLog) st.absenceLog = [];
                            st.absenceLog.push({ date: dateVal, day: "يوم المحاضرة", status: "غائب" });
                        } else if (stStatus === 'excused') {
                            st.excusedCount = (st.excusedCount || 0) + 1;
                            if (!st.absenceLog) st.absenceLog = [];
                            st.absenceLog.push({ date: dateVal, day: "يوم المحاضرة", status: "مجاز" });
                        }
                    }
                });
                showToast("تم تسجيل وحفظ جلسة الحضور بنجاح!");
            }

            await syncStateToCloud();
            renderContent();
        }

        function editSavedSession(sessId) {
            let sess = appState.savedSessions.find(s => s.id === sessId);
            if (!sess) return;

            document.getElementById('att-class-select').value = `${sess.className} - ${sess.section}`;
            document.getElementById('att-subject-select').value = sess.subject;
            document.getElementById('att-date-input').value = sess.date;

            loadAttendanceList(sess);
            showToast("جاري تحميل بيانات الجلسة للتعديل...");
        }

        function switchGradesSubTab(subIndex) {
            activeGradesSubTab = subIndex;
            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById(`grd-subtab-${i}`);
                if (!btn) continue;
                if (i === subIndex) {
                    btn.className = "flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap bg-slate-900 text-amber-400 font-black shadow-xs";
                } else {
                    btn.className = "flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300 text-slate-700 font-bold";
                }
            }
            renderGradesContent();
        }

            }

            let html = '';

            if (activeGradesSubTab === 0) {

        function recalcTerm1Sum(studentId) {
            let exam = parseFloat(document.getElementById(`inp-t1exam-${studentId}`).value) || 0;
            let evalVal = parseFloat(document.getElementById(`inp-t1eval-${studentId}`).value) || 0;
            let sumEl = document.getElementById(`sum-t1-${studentId}`);
            if (sumEl) sumEl.innerText = `${exam + evalVal}`;
        }

        function recalcTerm2Sum(studentId) {
            let exam = parseFloat(document.getElementById(`inp-t2exam-${studentId}`).value) || 0;
            let evalVal = parseFloat(document.getElementById(`inp-t2eval-${studentId}`).value) || 0;
            let sumEl = document.getElementById(`sum-t2-${studentId}`);
            if (sumEl) sumEl.innerText = `${exam + evalVal}`;
        }

        async function saveTerm1Grades() {
            appState.students.forEach(s => {
                let inpExam = document.getElementById(`inp-t1exam-${s.id}`);
                let inpEval = document.getElementById(`inp-t1eval-${s.id}`);
                if (inpExam) s.t1Exam = parseFloat(inpExam.value) || 0;
                if (inpEval) s.t1Eval = parseFloat(inpEval.value) || 0;
            });
            await syncStateToCloud();
            showToast("تم حفظ درجات الفصل الأول بنجاح!");
        }

        async function saveTerm2Grades() {
            appState.students.forEach(s => {
                let inpExam = document.getElementById(`inp-t2exam-${s.id}`);
                let inpEval = document.getElementById(`inp-t2eval-${s.id}`);
                if (inpExam) s.t2Exam = parseFloat(inpExam.value) || 0;
                if (inpEval) s.t2Eval = parseFloat(inpEval.value) || 0;
            });
            await syncStateToCloud();
            showToast("تم حفظ درجات الفصل الثاني بنجاح!");
        }

        async function saveFinalGrades() {
            appState.students.forEach(s => {
                let inpFinal = document.getElementById(`inp-final-${s.id}`);
                if (inpFinal) s.final = parseFloat(inpFinal.value) || 0;
            });
            await syncStateToCloud();
            showToast("تم حفظ درجات الفاينل بنجاح!");
        }

        // --- دوال تحديث وفلترة التقارير ---
        function setPrintHeaderStageLabel(elemId, stageVal, secVal) {
            let labelEl = document.getElementById(`${elemId}-print-label`);
            if (!labelEl) return;
            let sText = stageVal === 'all' ? 'جميع المراحل' : stageVal;
            let cText = secVal === 'all' ? 'جميع الشعب' : `شعبة (${secVal})`;
            labelEl.innerText = `${sText} - ${cText}`;
        }

        function getSearchKeyword() {
            let sInp = document.getElementById('report-search-input');
            return sInp ? sInp.value.trim().toLowerCase() : '';
        }

        // 1. تقرير قائمة الغياب والمجازين
        function updateAbsenceListReport() {
            const dateVal = document.getElementById('rep-abs-date').value;
            const stage = document.getElementById('rep-abs-stage').value;
            const sec = document.getElementById('rep-abs-sec').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabel('rep-abs-stage', stage, sec);

            let filtered = appState.students.filter(s => 
                (stage === 'all' || s.class === stage) && 
                (sec === 'all' || s.section === sec)
            );

            let savedSession = appState.savedSessions.find(sess => sess.date === dateVal && (stage === 'all' || sess.className === stage) && (sec === 'all' || sess.section === sec));

            let presentCount = 0;
            let absentCount = 0;
            let excusedCount = 0;
            let targetStudents = [];

            filtered.forEach(s => {
                let status = "حاضر";
                if (savedSession && savedSession.records && savedSession.records[s.id]) {
                    let stCode = savedSession.records[s.id];
                    status = stCode === 'absent' ? 'غائب' : stCode === 'excused' ? 'مجاز' : 'حاضر';
                } else {
                    let matchLog = (s.absenceLog || []).find(l => l.date === dateVal);
                    if (matchLog) status = matchLog.status;
                }

                if (status === 'حاضر') presentCount++;
                else if (status === 'غائب') {
                    absentCount++;
                    targetStudents.push({ ...s, currentStatus: 'غائب' });
                } else if (status === 'مجاز') {
                    excusedCount++;
                    targetStudents.push({ ...s, currentStatus: 'مجاز' });
                }
            });

            const statsBox = document.getElementById('absence-stats-box');
            if (statsBox) {
                statsBox.innerHTML = `
                    <div class="p-2.5 bg-emerald-50 rounded-2xl border border-emerald-200">
                        <span class="block text-emerald-700 text-lg font-black">${presentCount}</span>
                        <span class="text-[10px] text-slate-500 font-bold">عدد الحضور</span>
                    </div>
                    <div class="p-2.5 bg-rose-50 rounded-2xl border border-rose-200">
                        <span class="block text-rose-700 text-lg font-black">${absentCount}</span>
                        <span class="text-[10px] text-slate-500 font-bold">عدد الغياب</span>
                    </div>
                    <div class="p-2.5 bg-amber-50 rounded-2xl border border-amber-200">
                        <span class="block text-amber-700 text-lg font-black">${excusedCount}</span>
                        <span class="text-[10px] text-slate-500 font-bold">عدد المجازين</span>
                    </div>
                `;
            }

            if (searchKey) {
                targetStudents = targetStudents.filter(s => s.name.toLowerCase().includes(searchKey));
            }

            let rows = targetStudents.map((s, i) => `
                <tr class="border-b border-slate-100 text-[11px]">
                    <td class="p-2 font-bold text-center">${i+1}</td>
                    <td class="p-2 font-bold text-slate-800">${s.name}</td>
                    <td class="p-2 text-center">
                        <span class="px-3 py-0.5 rounded-full text-[10px] font-black ${s.currentStatus === 'غائب' ? 'bg-rose-100 text-rose-800 border border-rose-300' : 'bg-amber-100 text-amber-800 border border-amber-300'}">
                            ${s.currentStatus}
                        </span>
                    </td>
                    <td class="p-2 text-center text-slate-600">${s.phone || 'غير مسجل'}</td>
                </tr>
            `).join('');

            document.getElementById('absence-list-report-body').innerHTML = rows || '<tr><td colspan="4" class="p-4 text-center text-xs font-bold text-emerald-600">لا يوجد أي طلاب غائبين أو مجازين في هذا التاريخ</td></tr>';
        }

        // 3. تقرير الحضور الشهري
        function updateMonthlyAttReport() {
            const stage = document.getElementById('rep-month-stage').value;
            const sec = document.getElementById('rep-month-sec').value;
            const fromDate = document.getElementById('rep-month-from').value;
            const toDate = document.getElementById('rep-month-to').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabel('rep-month-stage', stage, sec);

            let filtered = appState.students.filter(s => 
                (stage === 'all' || s.class === stage) && 
                (sec === 'all' || s.section === sec) &&
                (!searchKey || s.name.toLowerCase().includes(searchKey))
            );

            let rows = filtered.map((s, i) => {
                let pCount = s.attendanceCount || 0;
                let aCount = 0;
                let eCount = 0;

                if (s.absenceLog && s.absenceLog.length > 0) {
                    s.absenceLog.forEach(log => {
                        if (log.date >= fromDate && log.date <= toDate) {
                            if (log.status === 'غائب') aCount++;
                            else if (log.status === 'مجاز') eCount++;
                        }
                    });
                } else {
                    aCount = s.absenceCount || 0;
                    eCount = s.excusedCount || 0;
                }

                let total = pCount + aCount + eCount || 1;
                let rate = Math.round((pCount / total) * 100);

                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 font-bold text-center">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800">${s.name}</td>
                        <td class="p-2 text-center font-black text-emerald-600">${pCount}</td>
                        <td class="p-2 text-center font-black text-rose-600">${aCount}</td>
                        <td class="p-2 text-center font-black text-amber-600">${eCount}</td>
                        <td class="p-2 text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${rate >= 85 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${rate}%
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('att-monthly-report-body').innerHTML = rows || '<tr><td colspan="6" class="p-3 text-center text-xs text-slate-400">لا يوجد طلبة مطابقين للشروط</td></tr>';
        }

        // 11. تجاوز نسبة الغياب
        function updateAttExceededReport() {
            const stage = document.getElementById('rep-exc-stage').value;
            const sec = document.getElementById('rep-exc-sec').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabel('rep-exc-stage', stage, sec);
            
            let filtered = appState.students.filter(s => 
                (stage === 'all' || s.class === stage) && 
                (sec === 'all' || s.section === sec) &&
                (!searchKey || s.name.toLowerCase().includes(searchKey))
            );
            
            let exceededStudents = filtered.filter(s => {
                let totalLec = (s.attendanceCount || 0) + (s.absenceCount || 0) + (s.excusedCount || 0) || 15;
                let rate = ((s.absenceCount || 0) / totalLec) * 100;
                return rate >= 10 || s.absenceCount >= 2;
            });
            
            let rows = exceededStudents.map((s, i) => {
                let totalLec = (s.attendanceCount || 0) + (s.absenceCount || 0) + (s.excusedCount || 0) || 15;
                let rate = (((s.absenceCount || 0) / totalLec) * 100).toFixed(1);
                return `
                    <tr class="border-b border-rose-100 text-[11px] bg-rose-50/50">
                        <td class="p-2 font-bold text-center">${i+1}</td>
                        <td class="p-2 font-bold text-slate-900">${s.name}</td>
                        <td class="p-2 text-center font-black text-rose-700">${s.absenceCount} غيابات</td>
                        <td class="p-2 text-center font-black text-rose-800">${rate}%</td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('att-exc-report-body').innerHTML = rows || '<tr><td colspan="4" class="p-3 text-center text-xs text-emerald-600 font-bold">لا يوجد طلبة تجاوزوا نسبة 10% من الغياب في هذه المرحلة/الشعبة</td></tr>';
        }

                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">العام الدراسي:</label>
                            <input id="inp-sch-year" type="text" value="${appState.schoolInfo.year}" placeholder="مثال: 2025 - 2026" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs outline-none font-bold text-slate-800">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">شعار الكلية أو الجامعة (يظهر في المنظومة والطباعة):</label>
                            <div class="flex items-center gap-3">
                                <div id="logo-preview-box" class="w-12 h-12 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden">
                                    ${appState.schoolInfo.logo ? `<img src="${appState.schoolInfo.logo}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-image text-slate-300"></i>`}
                                </div>
                                <div class="flex-1">
                                    <input type="file" id="inp-sch-logo-file" accept="image/*" onchange="handleLogoUpload(event)" class="text-[10px] w-full text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:text-[10px] file:font-bold file:bg-slate-900 file:text-amber-400 hover:file:bg-slate-800 cursor-pointer">
                                    <span class="text-[9px] text-slate-400 block mt-1">اختر صورة الشعار (PNG أو JPG) لاعتمادها رسمياً</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (actionKey === 'backup_data') {
                titleEl.innerText = "النسخ الاحتياطي المحلي";
                iconEl.className = "fa-solid fa-file-export";

                bodyEl.innerHTML = `
                    <div class="space-y-3.5 text-center p-3">
                        <i class="fa-solid fa-cloud-arrow-down text-4xl text-amber-500 mb-2"></i>
                        <h4 class="font-extrabold text-xs text-slate-800">حفظ نسخة احتياطية محلية (JSON)</h4>
                        <p class="text-[10px] text-slate-500 leading-relaxed font-medium">
                            يمكنك تنزيل ملف يحتوي على كل بيانات المنظومة والدرجات وسجلات الحضور والغياب للرجوع إليها في أي وقت.
                        </p>
                        <button onclick="downloadLocalBackupJSON()" class="w-full bg-slate-900 text-amber-400 py-2.5 rounded-xl font-black text-xs shadow-md hover:bg-slate-800 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-download"></i>
                            <span>تنزيل ملف النسخة الاحتياطية</span>
                        </button>
                    </div>
                `;
            } else {
                titleEl.innerText = "معلومات المنظومة";
                iconEl.className = "fa-solid fa-circle-info";
                bodyEl.innerHTML = `<div class="text-center py-4"><p class="text-xs text-slate-600">القسم متصل بقاعدة البيانات ومتوافق مع متطلبات الأستاذ الجامعي.</p></div>`;
            }
        }

        async function saveSupabaseSettings() {
            const url = document.getElementById('inp-supa-url').value.trim();
            const key = document.getElementById('inp-supa-key').value.trim();

            if (!url || !key) {
                showToast("الرجاء إدخال الـ URL والمفتاح الخاص بـ Supabase", "error");
                return;
            }

            localStorage.setItem('sp_supabase_url', url);
            localStorage.setItem('sp_supabase_key', key);
            appState.supabaseConfig.url = url;
            appState.supabaseConfig.key = key;

            try {
                supabaseClient = supabase.createClient(url, key);
                await testSupabaseConnection(true);
                closeModal();
            } catch(e) {
                showToast("خطأ في الاتصال، تأكد من صحة البيانات", "error");
            }
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                appState.schoolInfo.logo = e.target.result;
                const box = document.getElementById('logo-preview-box');
                if (box) {
                    box.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-contain">`;
                }
                await syncStateToCloud();
                showToast("تم تحميل شعار الكلية بنجاح!");
            };
            reader.readAsDataURL(file);
        }

        function downloadLocalBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `academic_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تنزيل ملف النسخة الاحتياطية!");
        }

        // --- Registered Students Edit Management ---
        function renderRegisteredStudentsList(container) {
            let studentRows = appState.students.map(s => `
                <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200 mb-2 flex justify-between items-center" id="std-card-${s.id}">
                    <div>
                        <h5 class="font-extrabold text-xs text-slate-800">${s.name}</h5>
                        <div class="flex items-center gap-2 mt-0.5 text-[10px] text-slate-500 font-medium">
                            <span><i class="fa-solid fa-layer-group text-indigo-500"></i> ${s.class} (${s.section})</span>
                            <span><i class="fa-brands fa-whatsapp text-emerald-500"></i> ${s.phone || 'غير مسجل'}</span>
                        </div>
                    </div>
                    <button onclick="editStudentData(${s.id})" class="bg-slate-900 text-amber-400 px-3 py-1.5 rounded-xl font-bold text-[10px] hover:bg-slate-800 transition-colors shadow-xs flex items-center gap-1">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>تعديل</span>
                    </button>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="space-y-2">
                    <p class="text-[10px] text-slate-500 font-bold mb-2">يمكنك التعديل مباشرة على الاسم، المرحلة، الشعبة ورقم الواتساب لأي طالب مسجل:</p>
                    <div class="max-h-80 overflow-y-auto custom-scroll">${studentRows}</div>
                </div>
            `;
        }

        function editStudentData(studentId) {
            let s = appState.students.find(st => st.id === studentId);
            if (!s) return;

            let container = document.getElementById('modal-body');
            let classOptions = appState.classes.map(c => `<option value="${c.name} - ${c.section}" ${(s.class === c.name && s.section === c.section) ? 'selected' : ''}>${c.name} (شعبة ${c.section})</option>`).join('');

            container.innerHTML = `
                <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-2xl mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-amber-600"></i>
                    <p class="text-[10px] font-bold text-slate-800">تعديل قيد الطالب: ${s.name}</p>
                </div>
                <div class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">الاسم الرباعي للطالب:</label>
                        <input id="edit-std-name" type="text" value="${s.name}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none focus:border-slate-900">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">المرحلة والشعبة:</label>
                        <select id="edit-std-class" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none">
                            ${classOptions}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">رقم الواتساب / الهاتف (اختياري):</label>
                        <input id="edit-std-phone" type="text" value="${s.phone || ''}" placeholder="يمكن تركه فارغاً" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none focus:border-slate-900">
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button onclick="saveUpdatedStudentData(${s.id})" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700">حفظ التعديلات</button>
                        <button onclick="triggerAction('manage_registered_students')" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold text-xs">إلغاء</button>
                    </div>
                </div>
            `;
        }

        async function saveUpdatedStudentData(studentId) {
            let s = appState.students.find(st => st.id === studentId);
            if (!s) return;

            let newName = document.getElementById('edit-std-name').value;
            let classVal = document.getElementById('edit-std-class').value;
            let newPhone = document.getElementById('edit-std-phone').value;

            if (!newName.trim()) { showToast("الرجاء إدخال الاسم", "error"); return; }

            const [className, sectionPart] = classVal.split(" - ");

            s.name = newName.trim();
            s.class = className.trim();
            s.section = (sectionPart || "أ").trim();
            s.phone = newPhone.trim();

            await syncStateToCloud();
            showToast("تم تعديل بيانات الطالب بنجاح!");
            triggerAction('manage_registered_students');
            renderContent();
        }

        function closeModal() {
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        async function handleModalSubmit() {
            if (currentModalType === 'add_class') {
                const name = document.getElementById('inp-class-name').value;
                const section = document.getElementById('inp-class-section').value;
                if (!name || !section) { showToast("الرجاء إدخال البيانات المطلوبة", "error"); return; }
                appState.classes.push({ id: Date.now(), name, section, count: 0 });
                showToast("تمت إضافة المرحلة والشعبة بنجاح");
            } 
            else if (currentModalType === 'add_student') {
                const name = document.getElementById('inp-std-name').value;
                const phone = document.getElementById('inp-std-phone').value || "";
                const classVal = document.getElementById('inp-std-class').value;
                if (!name.trim()) { showToast("الرجاء إدخال اسم الطالب", "error"); return; }
                const [className, sectionPart] = classVal.split(" - ");
                appState.students.push({ 
                    id: Date.now(), 
                    name: name.trim(), 
                    phone: phone.trim(), 
                    class: className, 
                    section: sectionPart || "أ", 
                    year: appState.schoolInfo.year, 
                    behavior: "جديد", 
                    note: "طالب مسجل حديثًا", 
                    t1Exam: 0, t1Eval: 0,
                    t2Exam: 0, t2Eval: 0,
                    final: 0,
                    attendanceCount: 0, 
                    absenceCount: 0,
                    excusedCount: 0,
                    absenceLog: [],
                    behaviorLog: []
                });
                showToast("تم إضافة الطالب بنجاح");
            } else if (currentModalType === 'add_subject') {
                const name = document.getElementById('inp-sub-name').value;
                const className = document.getElementById('inp-sub-class').value;
                if (!name) { showToast("الرجاء إدخال اسم المادة", "error"); return; }
                appState.subjects.push({ id: Date.now(), name, class: className, teacher: appState.schoolInfo.teacher });
                showToast("تمت إضافة المادة الدراسية بنجاح");
            } else if (currentModalType === 'add_schedule_item') {
                const day = document.getElementById('sch-day').value;
                const period = parseInt(document.getElementById('sch-period').value);
                const subject = document.getElementById('sch-subject').value;
                const className = document.getElementById('sch-class').value || "المرحلة الأولى (أ)";

                appState.schedule.push({ day, period, subject, className, time: "08:30 - 10:30", hall: "قاعة عامة" });
                showToast("تمت إضافة المحاضرة للجدول");
            } 
            else if (currentModalType === 'edit_school_info') {
                appState.schoolInfo.name = document.getElementById('inp-sch-name').value || appState.schoolInfo.name;
                appState.schoolInfo.teacher = document.getElementById('inp-sch-teacher').value || appState.schoolInfo.teacher;
                appState.schoolInfo.subject = document.getElementById('inp-sch-subj').value || appState.schoolInfo.subject;
                appState.schoolInfo.year = document.getElementById('inp-sch-year').value || appState.schoolInfo.year;
                showToast("تم حفظ البيانات الأكاديمية والعام الدراسي بنجاح");
            } else {
                showToast("تم حفظ التعديلات بنجاح");
            }

            await syncStateToCloud();
            closeModal();
            updateStatsBar();
            renderContent();
        }

        async function executeBulkImport() {
            const text = document.getElementById('inp-bulk-names').value;
            if (!text.trim()) { showToast("الرجاء إدخال الأسماء أولاً", "error"); return; }
            const lines = text.split('\n');
            let added = 0;
            lines.forEach(line => {
                if (line.trim()) {
                    appState.students.push({
                        id: Date.now() + Math.random(),
                        name: line.trim(),
                        phone: "",
                        class: "المرحلة الأولى",
                        section: "أ",
                        year: appState.schoolInfo.year,
                        behavior: "مميز",
                        note: "مستورد سحابياً",
                        t1Exam: 0, t1Eval: 0,
                        t2Exam: 0, t2Eval: 0,
                        final: 0,
                        attendanceCount: 0, absenceCount: 0, excusedCount: 0,
                        absenceLog: [],
                        behaviorLog: []
                    });
                    added++;
                }
            });
            await syncStateToCloud();
            showToast(`تم استيراد ${added} طالباً بنجاح!`);
            closeModal();
            updateStatsBar();
            renderContent();
        }

        async function deleteScheduleItem(period, day) {
            appState.schedule = appState.schedule.filter(s => !(s.period === period && s.day === day));
            await syncStateToCloud();
            showToast("تم حذف المحاضرة من الجدول");
            renderContent();
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('translate-y-0');
            }, 2800);
        }

        // Initialize Application
        window.onload = function() {
            const cached = localStorage.getItem('sp_academic_local_data');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.students) {
                        appState = parsed;
                    }
                } catch(e){}
            }

            initSupabase();
            switchTab(1);
        };
    </script>
</body>
</html>
