        function filterRegisteredStudentsList() {
            const searchInput = document.getElementById('registered-students-search');
            const list = document.getElementById('registered-students-list');
            if (!searchInput || !list) return;

            const query = normalizeStudentSearchText(searchInput.value);
            const cards = Array.from(list.querySelectorAll('.registered-student-card'));
            let visibleCount = 0;

            cards.forEach((card, index) => {
                const name = normalizeStudentSearchText(card.dataset.studentName || card.querySelector('h5')?.textContent || '');
                const matches = !query || name.includes(query);
                card.classList.toggle('hidden', !matches);
                if (matches) {
                    visibleCount++;
                    const rowNumber = card.querySelector('.registered-student-index');
                    if (rowNumber) rowNumber.textContent = String(visibleCount);
                }
            });

            const count = document.getElementById('registered-students-count');
            if (count) count.textContent = query
                ? `نتائج البحث: ${visibleCount} من ${cards.length}`
                : `عدد الطلبة: ${cards.length}`;

            const empty = document.getElementById('registered-students-empty');
            if (empty) {
                empty.classList.toggle('hidden', visibleCount > 0);
                empty.textContent = cards.length === 0
                    ? 'لا يوجد طلبة مسجلين حالياً'
                    : 'لا توجد أسماء مطابقة للبحث';
            }
        }

        function addSubjectToCatalog() {
            const input = document.getElementById('inp-sub-name');
            const name = String(input && input.value || '').trim();
            if (!name) { showToast('الرجاء إدخال اسم المادة الدراسية', 'error'); return; }
            if ((appState.subjectCatalog || []).some(item => normalizeAcademicText(item.name) === normalizeAcademicText(name))) {

            if (!Array.isArray(appState.subjectCatalog)) appState.subjectCatalog = [];
            appState.subjectCatalog.push({ id: Date.now() + Math.random(), name, teacher: (appState.schoolInfo && appState.schoolInfo.teacher) || '' });
            appState.subjectCatalog.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            syncStateToCloud();
            showToast('تمت إضافة المادة إلى سجل المواد العام. اربطها بالشعب من إدارة المراحل والشعب.');
            updateStatsBar();
            triggerAction('add_subject');
            renderContent();
        }

        function editSubjectItem(subjectId) {
            const sub = (appState.subjectCatalog || []).find(item => String(item.id) === String(subjectId));
            if (!sub) return;
            const container = document.getElementById('modal-body');
            container.innerHTML = `
                <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-2xl mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-600"></i>
                    <p class="text-[10px] font-bold text-slate-800">تعديل اسم المادة: ${escapeHtml(sub.name)}</p>
                </div>
                <div class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">اسم المادة الجامعية:</label>
                        <input id="edit-sub-name" type="text" value="${escapeHtml(sub.name)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none">
                        <p class="text-[9px] text-slate-500 mt-1">تعديل الاسم يحدّث ربط المادة بالشعب والقوائم والتقارير والسجلات المرتبطة بها.</p>
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button onclick="saveUpdatedSubjectItem(${JSON.stringify(sub.id)})" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700">حفظ التعديل</button>
                        <button onclick="triggerAction('add_subject')" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold text-xs">إلغاء</button>
                    </div>
                </div>`;
        }

        function saveUpdatedSubjectItem(subjectId) {
            const sub = (appState.subjectCatalog || []).find(item => String(item.id) === String(subjectId));
            if (!sub) return;
            const input = document.getElementById('edit-sub-name');
            const newName = String(input && input.value || '').trim();
            const oldName = String(sub.name || '').trim();
            if (!newName) { showToast('الرجاء إدخال اسم المادة', 'error'); return; }
            if ((appState.subjectCatalog || []).some(item => String(item.id) !== String(subjectId) && normalizeAcademicText(item.name) === normalizeAcademicText(newName))) {
                showToast('توجد مادة أخرى بهذا الاسم؛ اختر اسماً مختلفاً', 'error'); return;
            }

            const oldKey = normalizeAcademicText(oldName);
            sub.name = newName;
            (appState.subjects || []).forEach(item => { if (normalizeAcademicText(item.name) === oldKey) item.name = newName; });
            (appState.students || []).forEach(student => {
                if (normalizeAcademicText(student.subject) === oldKey) student.subject = newName;
                (Array.isArray(student.behaviorLog) ? student.behaviorLog : []).forEach(log => {
                    if (log && normalizeAcademicText(log.subject) === oldKey) log.subject = newName;
                });
            });
            (appState.savedSessions || []).forEach(session => { if (session && normalizeAcademicText(session.subject) === oldKey) session.subject = newName; });
            (appState.schedule || []).forEach(item => { if (item && normalizeAcademicText(item.subject) === oldKey) item.subject = newName; });
            if (appState.schoolInfo && normalizeAcademicText(appState.schoolInfo.subject) === oldKey) appState.schoolInfo.subject = newName;

            // عند تغيير الاسم إلى اسم مستخدم سابقاً في نفس الشعبة، ادمج الربط المكرر.
            const assignments = new Map();
            (appState.subjects || []).forEach(item => {
                const key = getSubjectAssignmentKey(item.name, item.class, item.section, item.studyType || 'صباحي');
                if (!assignments.has(key)) assignments.set(key, item);
            });
            appState.subjects = Array.from(assignments.values());
            syncStateToCloud();
            showToast('تم تعديل اسم المادة وتحديث ارتباطاتها بنجاح');
            updateStatsBar();
            triggerAction('add_subject');
            renderContent();
        }

        function deleteSubjectItem(subjectId) {
            const sub = (appState.subjectCatalog || []).find(item => String(item.id) === String(subjectId));
            if (!sub) return;
            const name = String(sub.name || '').trim();
            if (!confirm(`هل أنت متأكد من حذف المادة «${name}» من سجل المواد؟ سيُحذف ربطها بالشعب والمحاضرات المجدولة، مع الإبقاء على السجلات التاريخية للطلبة والحضور والدرجات.`)) return;

            const key = normalizeAcademicText(name);
            appState.subjectCatalog = (appState.subjectCatalog || []).filter(item => String(item.id) !== String(subjectId));
            appState.subjects = (appState.subjects || []).filter(item => normalizeAcademicText(item.name) !== key);
            appState.schedule = (appState.schedule || []).filter(item => normalizeAcademicText(item && item.subject) !== key);
            // لا نحذف الدرجات أو سجلات الحضور/السلوك التاريخية، حتى لا تضيع البيانات الأكاديمية المحفوظة.
            syncStateToCloud();
            showToast('تم حذف المادة من القائمة والارتباطات النشطة');
            updateStatsBar();
            triggerAction('add_subject');
            renderContent();
        }

        function closeModal() {
            const modalSubmit = document.getElementById('modal-submit-btn');
            if (modalSubmit) modalSubmit.style.display = '';
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        function handleModalSubmit() {
            if (currentModalType === 'add_class') {
                const name = document.getElementById('inp-class-name').value.trim();
                const section = document.getElementById('inp-class-section').value.trim();
                const studyType = document.getElementById('inp-class-study').value || 'صباحي';
                const subjectNames = document.getElementById('inp-class-subjects') ? document.getElementById('inp-class-subjects').value : '';
                if (!name || !section) { showToast("الرجاء إدخال البيانات المطلوبة", "error"); return; }
                const duplicate = appState.classes.some(cls => normalizeAcademicText(cls.name) === normalizeAcademicText(name) &&
                    normalizeAcademicText(cls.section) === normalizeAcademicText(section) &&
                    normalizeAcademicText(cls.studyType || 'صباحي') === normalizeAcademicText(studyType));
                if (duplicate) { showToast("هذه المرحلة والشعبة ونوع الدراسة مسجلة مسبقاً", "error"); return; }
                const newClass = { id: Date.now(), name, section, studyType, count: 0 };
                appState.classes.push(newClass);
                applyClassSubjectNames(newClass, subjectNames);
                showToast("تمت إضافة المرحلة والشعبة والمواد المرتبطة بها بنجاح");
            } 
            else if (currentModalType === 'add_student') {
                const name = document.getElementById('inp-std-name').value;
                const classVal = document.getElementById('inp-std-class').value;
                if (!name.trim()) { showToast("الرجاء إدخال اسم الطالب", "error"); return; }
                const [className, sectionPart, studyPart] = classVal.split(" - ");
                appState.students.push({ 
                    id: Date.now(), 
                    name: name.trim(), 
                    class: className, 
                    section: sectionPart || "أ", 
                    studyType: studyPart || "صباحي",
                    year: appState.schoolInfo.year, 
                    behavior: "جديد", 
                    note: "طالب مسجل حديثًا", 
                    t1Exam: 0, t1Eval: 0,
                    t2Exam: 0, t2Eval: 0,
                    final: 0,
                    attendanceCount: 0, 
                    absenceCount: 0,
                    excusedCount: 0,
                    absenceLog: [],
                    behaviorLog: []
                });
                showToast("تم إضافة الطالب بنجاح");
            } else if (currentModalType === 'add_subject') {
                // التوافق مع أي نموذج قديم: المواد تُسجّل في الكتالوج العام فقط.
                const name = String(document.getElementById('inp-sub-name') && document.getElementById('inp-sub-name').value || '').trim();
                if (!name) { showToast("الرجاء إدخال اسم المادة", "error"); return; }
                if ((appState.subjectCatalog || []).some(item => normalizeAcademicText(item.name) === normalizeAcademicText(name))) {
                    showToast("هذه المادة مسجلة مسبقاً", "error"); return;
                }
                if (!Array.isArray(appState.subjectCatalog)) appState.subjectCatalog = [];
                appState.subjectCatalog.push({ id: Date.now() + Math.random(), name, teacher: appState.schoolInfo.teacher || '' });
                showToast("تمت إضافة المادة إلى سجل المواد العام؛ اربطها بالشعب من إدارة المراحل والشعب");
            } else if (currentModalType === 'add_schedule_item') {
                const day = document.getElementById('sch-day').value;
                const subject = document.getElementById('sch-subject').value;
                const time = document.getElementById('sch-time').value || "08:30 - 10:30";
                const classVal = document.getElementById('sch-class-select').value;
                const hall = document.getElementById('sch-hall').value || "قاعة عامة";
                const selectedClass = parseClassSelection(classVal);
                if (!subject || !isAssignedSubjectToClass(subject, selectedClass.name, selectedClass.section, selectedClass.studyType)) {
                    showToast("اختر مادة مرتبطة بالمرحلة والشعبة ونوع الدراسة المحددة", "error");
                    return;
                }

                appState.schedule.push({ 
                    id: Date.now(), 
                    day, 
                    subject, 
                    className: `${selectedClass.name} (${selectedClass.section} - ${selectedClass.studyType})`, 
                    time: time, 
                    hall: hall 
                });
                showToast("تمت إضافة المحاضرة للجدول وربطها بالمادة والشعبة");
            } 
            else if (currentModalType === 'edit_school_info') {
                // تهيئة كائن البيانات وضمان قراءة جميع الحقول الظاهرة في النموذج قبل الحفظ.
                if (!appState.schoolInfo || typeof appState.schoolInfo !== 'object') appState.schoolInfo = {};
                const schoolNameInput = document.getElementById('inp-sch-name');
                const universityInput = document.getElementById('inp-sch-university');
                const collegeInput = document.getElementById('inp-sch-college');
                const departmentInput = document.getElementById('inp-sch-department');
                const teacherInput = document.getElementById('inp-sch-teacher');
                const subjectInput = document.getElementById('inp-sch-subj');
                const yearInput = document.getElementById('inp-sch-year');

                if (schoolNameInput) appState.schoolInfo.name = schoolNameInput.value.trim() || appState.schoolInfo.name || '';
                if (universityInput) appState.schoolInfo.university = universityInput.value.trim();
                if (collegeInput) appState.schoolInfo.college = collegeInput.value.trim();
                if (departmentInput) appState.schoolInfo.department = departmentInput.value.trim();
                if (teacherInput) appState.schoolInfo.teacher = teacherInput.value.trim() || appState.schoolInfo.teacher || '';
                if (subjectInput) appState.schoolInfo.subject = subjectInput.value.trim() || appState.schoolInfo.subject || '';
                if (yearInput) appState.schoolInfo.year = yearInput.value.trim() || appState.schoolInfo.year || '';

                // تتم الكتابة للحفظ المحلي ومزامنة الخدمات السحابية مباشرة بعد انتهاء هذا الفرع.
                showToast("تم حفظ بيانات الجامعة والكلية والقسم والأستاذ بنجاح");
            } else if (currentModalType === 'edit_google_config') {
                const clientInput = document.getElementById('google-client-id-input');
                if (clientInput) appState.googleConfig.clientId = clientInput.value.trim();
                if (!appState.googleConfig) appState.googleConfig = { clientId: "", connected: false, fileId: "" };
                syncStateToCloud();
                updateGoogleDriveStatus();
                showToast("تم حفظ إعدادات الربط مع Google");
            } else {
                showToast("تم حفظ التعديلات بنجاح");
            }

            syncStateToCloud();
            closeModal();
            updateStatsBar();
            renderContent();
        }

        function executeBulkImport() {
            const text = document.getElementById('inp-bulk-names').value;
            const classVal = document.getElementById('import-std-class').value;

            if (!text.trim()) { showToast("الرجاء إدخال الأسماء أولاً", "error"); return; }
            const [className, sectionPart, studyPart] = classVal.split(" - ");

            const lines = text.split('\n');
            let added = 0;
            lines.forEach(line => {
                if (line.trim()) {
                    appState.students.push({
                        id: Date.now() + Math.random(),
                        name: line.trim(),
                        class: className,
                        section: sectionPart || "أ",
                        studyType: studyPart || "صباحي",
                        year: appState.schoolInfo.year,
                        behavior: "مميز",
                        note: "مستورد",
                        t1Exam: 0, t1Eval: 0,
                        t2Exam: 0, t2Eval: 0,
                        final: 0,
                        attendanceCount: 0, absenceCount: 0, excusedCount: 0,
                        absenceLog: [],
                        behaviorLog: []
                    });
                    added++;
                }
            });
            syncStateToCloud();
            showToast(`تم استيراد ${added} طالباً بنجاح!`);
            closeModal();
            updateStatsBar();
            renderContent();
        }

        function deleteScheduleItem(itemId) {
            appState.schedule = appState.schedule.filter(s => s.id !== itemId);
            syncStateToCloud();
            showToast("تم حذف المحاضرة من الجدول");
            renderContent();
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const optimizedLogo = canvas.toDataURL('image/png', 0.8);

                    appState.schoolInfo.logo = optimizedLogo;
                    const box = document.getElementById('logo-preview-box');
                    if (box) {
                        box.innerHTML = `<img src="${optimizedLogo}" class="w-full h-full object-contain">`;
                    }
                    updateStatsBar();
                    syncStateToCloud();
                    showToast("تم حفظ وضغط الشعار بنجاح!");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function downloadLocalBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `academic_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تنزيل ملف النسخة الاحتياطية!");
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('translate-y-0');
            }, 2000);
        }

        window.onload = function() {
            try {
                const cached = localStorage.getItem('sp_academic_local_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.students) {
                        const cloudCfg = appState.supabaseConfig;
                        const googleCfg = parsed.googleConfig || appState.googleConfig || { clientId: "", connected: false, fileId: "" };
                        appState = parsed;
                        appState.supabaseConfig = cloudCfg;
                        appState.googleConfig = googleCfg;
                        normalizeAppState();
                    }
                }
            } catch(e) {
                console.warn("Local storage cache read error:", e);
            }

            normalizeAppState();
            // access tokens are memory-only; the user may reconnect from Settings to restore the Drive backup.
            if (appState.googleConfig) appState.googleConfig.connected = false;
            // حفظ الترحيل المحلي الجديد مباشرة حتى لا تعود البيانات القديمة إلى نمط الربط السابق عند إعادة فتح الملف.
            persistLocalState();
            initSupabase();
            switchTab(1);
        };
    </script>
</body>
