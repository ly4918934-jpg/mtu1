                    .from('professor_data')
                    .select('data')
                    .eq('id', 'main_academic_state')
                    .single();

                if (error && error.code !== 'PGRST116') {
                    throw error;
                }

                if (data && data.data) {
                    const localConfig = appState.supabaseConfig;
                    const localGoogleConfig = appState.googleConfig || { clientId: "", connected: false, fileId: "" };
                    appState = data.data;
                    appState.supabaseConfig = localConfig;

                    normalizeAppState();
                    renderContent();
                    updateStatsBar();
                } else {
                    syncStateToCloud();

                console.error("Supabase Error:", err);
                setSupabaseStatus(false);

        async function ensureGoogleIdentityLoaded() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) return;
            await new Promise((resolve, reject) => {
                let script = document.querySelector('script[data-google-identity-loader]');
                if (script) {
                    script.addEventListener('load', resolve, { once: true });
                    script.addEventListener('error', reject, { once: true });
                    return;
                }
                script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                script.dataset.googleIdentityLoader = 'true';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
            if (!(window.google && window.google.accounts && window.google.accounts.oauth2)) {
                throw new Error('تعذر تحميل مكتبة تسجيل الدخول من Google');
            }
        }

        function saveGoogleClientIdFromForm() {
            const input = document.getElementById('google-client-id-input');
            if (input) appState.googleConfig.clientId = input.value.trim();
            if (!appState.googleConfig.clientId) {
                showToast('أدخل Google OAuth Client ID أولاً ثم احفظ الإعدادات', 'error');
                return false;
            }
            try { localStorage.setItem('sp_academic_local_data', JSON.stringify(appState)); } catch (e) {}
            return true;
        }

        async function requestGoogleDriveAccessToken() {
            await ensureGoogleIdentityLoaded();
            return await new Promise((resolve, reject) => {
                try {
                    googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: appState.googleConfig.clientId,
                        scope: 'https://www.googleapis.com/auth/drive.appdata',
                        callback: (response) => {
                            if (response && response.access_token) {
                                googleAccessToken = response.access_token;
                                resolve(response);
                            } else {
                                reject(new Error((response && (response.error_description || response.error)) || 'لم يتم منح إذن الوصول إلى Google Drive'));
                            }
                        },
                        error_callback: (error) => reject(new Error((error && error.message) || 'تعذر إكمال تسجيل الدخول إلى Google'))
                    });
                    googleTokenClient.requestAccessToken({ prompt: 'consent' });
                } catch (error) { reject(error); }
            });
        }

        async function googleDriveFetch(url, options = {}) {
            if (!googleAccessToken) throw new Error('حساب Google غير متصل. أعد الربط أولاً.');
            const headers = { Authorization: `Bearer ${googleAccessToken}`, ...(options.headers || {}) };
            const response = await fetch(url, { ...options, headers });
            if (!response.ok) {
                const detail = await response.text().catch(() => '');
                if (response.status === 401) {
                    googleAccessToken = null;
                    updateGoogleDriveStatus('انتهت صلاحية الاتصال. أعد الربط بحساب Google للمتابعة.');
                }
                throw new Error(`Google Drive (${response.status}): ${detail || response.statusText}`);
            }
            return response;
        }

        async function findGoogleDriveBackup() {
            const query = encodeURIComponent(`name = '${GOOGLE_DRIVE_BACKUP_NAME}' and trashed = false`);
            const url = `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${query}&pageSize=100&fields=files(id,name,modifiedTime)`;
            const response = await googleDriveFetch(url);
            const data = await response.json();
            const file = (data.files || []).find(item => item.name === GOOGLE_DRIVE_BACKUP_NAME);
            appState.googleConfig.fileId = file ? file.id : '';
            return file || null;
        }

        async function writeGoogleDriveBackup() {
            if (!googleAccessToken) return false;
            const backupPayload = JSON.stringify(appState);
            let fileId = appState.googleConfig && appState.googleConfig.fileId;
            if (!fileId) {
                const existing = await findGoogleDriveBackup();
                fileId = existing && existing.id;
            }
            if (!fileId) {
                const createResponse = await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: GOOGLE_DRIVE_BACKUP_NAME, parents: ['appDataFolder'], mimeType: 'application/json' })
                });
                const created = await createResponse.json();
                fileId = created.id;
                appState.googleConfig.fileId = fileId;
            }
            await googleDriveFetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: backupPayload
            });
            try { localStorage.setItem('sp_academic_local_data', JSON.stringify(appState)); } catch (e) {}
            updateGoogleDriveStatus('تمت مزامنة البيانات إلى Google Drive');
            return true;
        }

        async function readGoogleDriveBackup() {
            const file = await findGoogleDriveBackup();
            if (!file) return false;
            const response = await googleDriveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`);
            const remoteState = await response.json();
            if (!remoteState || !Array.isArray(remoteState.students)) throw new Error('ملف النسخة السحابية لا يحتوي على بيانات منظومة صالحة');
            const localSupabaseConfig = appState.supabaseConfig;
            const localGoogleConfig = { ...(appState.googleConfig || {}), connected: true, fileId: file.id };
            appState = remoteState;
            appState.supabaseConfig = localSupabaseConfig;
            appState.googleConfig = localGoogleConfig;
            normalizeAppState();
            updateStatsBar();
            renderContent();
            try { localStorage.setItem('sp_academic_local_data', JSON.stringify(appState)); } catch (e) {}
            // إبقاء قاعدة Supabase الحالية متزامنة مع البيانات المستعادة أيضاً.
            if (supabaseClient && appState.supabaseConfig.connected) syncStateToCloud();
            return true;
        }

        async function connectGoogleDrive() {
            if (!appState.googleConfig) appState.googleConfig = { clientId: '', connected: false, fileId: '' };
            if (!saveGoogleClientIdFromForm()) return;
            try {
                updateGoogleDriveStatus('جارٍ فتح نافذة تسجيل الدخول إلى Google…');
                await requestGoogleDriveAccessToken();
                appState.googleConfig.connected = true;
                updateGoogleDriveStatus('تم تسجيل الدخول، جارٍ البحث عن النسخة السحابية…');
                const restored = await readGoogleDriveBackup();
                if (restored) {
                    showToast('تم ربط Google واستعادة البيانات السحابية بنجاح');
                } else {
                    await writeGoogleDriveBackup();
                    showToast('تم ربط Google وحفظ بيانات المنظومة الحالية في السحابة');
                }
                syncStateToCloud();
                updateGoogleDriveStatus('Google Drive متصل والمزامنة مفعلة');
            } catch (error) {
                console.error('Google Drive connection error:', error);
                updateGoogleDriveStatus('تعذر الربط: ' + (error.message || 'تحقق من إعدادات Google'));
                showToast('فشل الربط مع Google: تحقق من Client ID وتفعيل Drive API', 'error');
            }
        }

        function scheduleGoogleDriveSync() {
            if (!googleAccessToken) return;
            if (googleSyncTimeout) clearTimeout(googleSyncTimeout);
            googleSyncTimeout = setTimeout(async () => {
                try {
                    if (googleSyncInProgress) { googleSyncPending = true; return; }
                    googleSyncInProgress = true;
                    await writeGoogleDriveBackup();
                } catch (error) {
                    console.warn('Google Drive background sync failed:', error);
                    updateGoogleDriveStatus('تعذرت المزامنة. افتح إعدادات Google وأعد الربط إذا انتهت الصلاحية.');
                } finally {
                    googleSyncInProgress = false;
                    if (googleSyncPending) {
                        googleSyncPending = false;
                        scheduleGoogleDriveSync();
                    }
                }
            }, 300);
        }

        async function syncGoogleDriveNow() {
            if (!googleAccessToken) {
                showToast('اربط حساب Google أولاً لتفعيل المزامنة', 'error');

            if (stTot) stTot.innerText = appState.students.length;

            const clsTot = document.getElementById('stat-total-classes');
            if (clsTot) clsTot.innerText = appState.classes.length;

            const subTot = document.getElementById('stat-total-subjects');
            if (subTot) subTot.innerText = appState.subjects.length;

            const schTitle = document.getElementById('school-header-title');
            if (schTitle) schTitle.innerText = appState.schoolInfo.name;

            const logoImg = document.getElementById('header-logo-img');
            const mainIcon = document.getElementById('header-main-icon');

            if (logoImg && mainIcon) {
                if (appState.schoolInfo.logo) {
                    logoImg.src = appState.schoolInfo.logo;
                    logoImg.classList.remove('hidden');
                    mainIcon.classList.add('hidden');
                } else {
                    logoImg.classList.add('hidden');
                    mainIcon.classList.remove('hidden');
                }
            }
            if (typeof updateGoogleDriveStatus === 'function') updateGoogleDriveStatus();
        }

        function renderContent() {
            const container = document.getElementById('app-content');
            if (!container) return;
            const data = tabsData[activeTabIndex];

            if (data.isSettings) {
                renderSettingsTab(container);
            } else if (data.isSchedule) {
                renderScheduleTab(container);
            } else if (data.isAttendance) {
                renderAttendanceTab(container);
            } else if (data.isBehavior) {
                renderBehaviorTab(container);
            } else if (data.isGradesTab) {
                renderGradesTab(container);
            } else if (data.isReports) {
                renderReportsTab(container);
            } else {
                renderCardsTab(container, data.cards);
            }
        }

        function renderBehaviorStudentsList() {
            const classFilterVal = document.getElementById('beh-filter-class') ? document.getElementById('beh-filter-class').value : 'all';

            if (!container) return;

            let filtered = [...appState.students];

            if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            filtered = sortStudentsAlphabetically(filtered);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 text-center border border-slate-200/80">
                        <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>

                    </div>
                `;
                return;
            }

            let html = filtered.map((st, i) => {
                let badgeClass = 'bg-slate-100 text-slate-700';
                if (st.behavior === 'مميز') badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                else if (st.behavior === 'متوسط') badgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                else if (st.behavior === 'سيء') badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';

                return `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 mb-2">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">

                                <div>
                                    <h4 class="font-bold text-xs text-slate-800">${st.name}</h4>
                                    <p class="text-[10px] text-slate-400">${st.class} (${st.section}) - <strong class="text-indigo-600">${st.studyType || 'صباحي'}</strong></p>
                                </div>
                            </div>
                            <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${badgeClass}" id="beh-badge-${st.id}">
                                ${st.behavior || 'غير محدد'}
                            </span>
                        </div>
                        <div class="flex items-center gap-1.5 pt-2 border-t border-slate-100">
                            <span class="text-[10px] font-bold text-slate-500 ml-1">إضافة علامة:</span>
                            <button onclick="assignStudentMark(${st.id}, 'مميز')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-star text-[9px]"></i>
                                <span>مميز</span>
                            </button>
                            <button onclick="assignStudentMark(${st.id}, 'متوسط')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-minus text-[9px]"></i>
                                <span>متوسط</span>
                            </button>
                            <button onclick="assignStudentMark(${st.id}, 'سيء')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-triangle-exclamation text-[9px]"></i>
                                <span>سيء</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function assignStudentMark(studentId, mark) {
            const student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const dateVal = document.getElementById('beh-filter-date').value || new Date().toISOString().split('T')[0];
            const subjectVal = document.getElementById('beh-filter-subject').value || "عام";

            student.behavior = mark;
            if (!student.behaviorLog) student.behaviorLog = [];

            student.behaviorLog.push({
                mark: mark,
                stage: student.class,
                section: student.section,
                studyType: student.studyType || "صباحي",
                subject: subjectVal,
                date: dateVal
            });

            const badge = document.getElementById(`beh-badge-${student.id}`);
            if (badge) {
                badge.innerText = mark;
                badge.className = `text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${mark === 'مميز' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : mark === 'متوسط' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            }

            syncStateToCloud();
            showToast(`تم إضافة علامة (${mark}) للطالب ${student.name} بنجاح!`);
        }

                    if (st.absenceLog) {

            appState.savedSessions = appState.savedSessions.filter(s => s.id !== sessId);

                s.section.trim() === section.trim() &&

        function setSingleAttendanceStatus(studentId, status) {
            currentAttendanceMap[studentId] = status;
            currentAttendanceMap[String(studentId)] = status;
            const btnBox = document.getElementById(`att-btns-${studentId}`);
            if (!btnBox) return;
            const buttons = btnBox.querySelectorAll('button');
            if (buttons.length >= 3) {
                buttons[0].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
                buttons[1].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
                buttons[2].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}`;
            }
        }

        function setAllAttendanceStatus(status) {
            if (!currentLoadedAttendanceStudents || currentLoadedAttendanceStudents.length === 0) return;
            currentLoadedAttendanceStudents.forEach(st => {
                setSingleAttendanceStatus(st.id, status);
            });
            showToast(status === 'present' ? "تم تحديد جميع الطلبة كـ حاضر ✓" : "تم تحديد جميع الطلبة كـ غائب ✗");
        }

        function saveAttendanceRecord(editingSessionId = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const dateVal = document.getElementById('att-date-input').value;

            if (!classVal || !dateVal) {
                showToast("الرجاء اختيار المرحلة وتاريخ المحاضرة", "error");
                return;
            }

            const [className, sectionPart, studyPart] = classVal.split(" - ");
            const section = sectionPart || "أ";
            const studyType = studyPart || "صباحي";
            const dayText = getDayName(dateVal);

            let cleanRecords = {};
            Object.keys(currentAttendanceMap).forEach(k => {
                cleanRecords[k] = currentAttendanceMap[k];
            });

            if (editingSessionId) {
                let sess = appState.savedSessions.find(s => s.id === editingSessionId);
                if (sess) {
                    sess.date = dateVal;
                    sess.className = className;
                    sess.section = section;
                    sess.studyType = studyType;
                    sess.subject = subjectVal;
                    sess.records = cleanRecords;
                }
            } else {
                let newSession = {
                    id: Date.now(),
                    date: dateVal,
                    className: className,
                    section: section,
                    studyType: studyType,
                    subject: subjectVal,
                    records: cleanRecords
                };
                appState.savedSessions.unshift(newSession);
            }

            currentLoadedAttendanceStudents.forEach(st => {
                let currentStudent = appState.students.find(s => s.id === st.id);
                if (!currentStudent) return;

                if (!currentStudent.absenceLog) currentStudent.absenceLog = [];
                currentStudent.absenceLog = currentStudent.absenceLog.filter(log => log.date !== dateVal);

                let stStatus = cleanRecords[st.id] || cleanRecords[String(st.id)] || 'present';

                if (stStatus === 'absent') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "غائب" });
                } else if (stStatus === 'excused') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "مجاز" });
                }

                let absCount = currentStudent.absenceLog.filter(l => l.status === 'غائب').length;
                let excCount = currentStudent.absenceLog.filter(l => l.status === 'مجاز').length;
                currentStudent.absenceCount = absCount;
                currentStudent.excusedCount = excCount;
                if (!currentStudent.attendanceCount) currentStudent.attendanceCount = 14;
                if (stStatus === 'present' && !editingSessionId) {
                    currentStudent.attendanceCount += 1;
                }
            });

            showToast("تم حفظ جلسة الحضور بنجاح وربطها مع التقارير!");
            syncStateToCloud();
            renderContent();
        }

        function editSavedSession(sessId) {
            let sess = appState.savedSessions.find(s => s.id === sessId);
            if (!sess) return;

            document.getElementById('att-class-select').value = `${sess.className} - ${sess.section} - ${sess.studyType || 'صباحي'}`;

            loadAttendanceList(sess);
            showToast("جاري تحميل بيانات الجلسة للتعديل...");

        // تحديث المستطيل في متن الورقة ليتضمن نوع الدراسة بجانب المرحلة والشعبة والمادة
        function setPrintHeaderStageLabelUnified(elemId, classVal) {
            const stageEl = document.getElementById(`${elemId}-strip-stage`);
            const secEl = document.getElementById(`${elemId}-strip-section`);
            const studyEl = document.getElementById(`${elemId}-strip-study`);
            const subjEl = document.getElementById(`${elemId}-strip-subject`);

            if (!stageEl || !secEl || !studyEl || !subjEl) return;

            if (classVal === 'all' || !classVal) {
                stageEl.innerText = "المرحلة: جميع المراحل";
                secEl.innerText = "الشعبة: جميع الشعب";
                studyEl.innerText = "نوع الدراسة: جميع الدراسات";
                subjEl.innerText = `المادة: ${appState.schoolInfo.subject}`;
            } else {
                const parts = classVal.split(' - ');
                const cName = parts[0] ? parts[0].trim() : '';
                const sSec = parts[1] ? parts[1].trim() : '';
                const sStudy = parts[2] ? parts[2].trim() : 'صباحي';

                stageEl.innerText = `المرحلة: ${cName}`;
                secEl.innerText = `الشعبة: ${sSec}`;
                studyEl.innerText = `نوع الدراسة: ${sStudy}`;
                subjEl.innerText = `المادة: ${appState.schoolInfo.subject}`;
            }
        }

        // 1. تقرير قائمة الغياب والمجازين
        function updateAbsenceListReport() {
            const dateVal = document.getElementById('rep-abs-date').value;
            const classFilterVal = document.getElementById('rep-abs-class').value;
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabelUnified('rep-abs-stage', classFilterVal);

            let filtered = [...appState.students];
            let cName = "", sSec = "", sStudy = "";

            if (classFilterVal !== 'all') {
                [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            let savedSession = appState.savedSessions.find(sess => 
                sess.date === dateVal && 
                (classFilterVal === 'all' || (sess.className === cName && sess.section === sSec && (sess.studyType || 'صباحي') === sStudy))
            );

            let presentCount = 0;
            let absentCount = 0;
            let excusedCount = 0;
            let targetStudents = [];

            filtered.forEach(s => {
                let status = "حاضر";
                if (savedSession && savedSession.records) {
                    let stCode = savedSession.records[s.id] || savedSession.records[String(s.id)];
                    if (stCode) {
                        status = stCode === 'absent' ? 'غائب' : stCode === 'excused' ? 'مجاز' : 'حاضر';
                    } else {
                        let matchLog = (s.absenceLog || []).find(l => l.date === dateVal);
                        if (matchLog) status = matchLog.status;
                    }
                } else {
                    let matchLog = (s.absenceLog || []).find(l => l.date === dateVal);
                    if (matchLog) status = matchLog.status;
                }

                if (status === 'حاضر') {
                    presentCount++;
                } else if (status === 'غائب') {
                    absentCount++;
                    targetStudents.push({ ...s, currentStatus: 'غائب' });
                } else if (status === 'مجاز') {
                    excusedCount++;
                    targetStudents.push({ ...s, currentStatus: 'مجاز' });
                }
            });

            const statsBox = document.getElementById('absence-stats-box');
            if (statsBox) {
                statsBox.innerHTML = `
                    <div class="p-2.5 bg-emerald-50 rounded-2xl border border-emerald-200">
                        <span class="block text-emerald-700 text-lg font-black">${presentCount}</span>
                        <span class="text-[10px] text-slate-500 font-bold">عدد الحضور</span>
                    </div>
                    <div class="p-2.5 bg-rose-50 rounded-2xl border border-rose-200">
                        <span class="block text-rose-700 text-lg font-black">${absentCount}</span>
                        <span class="text-[10px] text-slate-500 font-bold">عدد الغياب</span>
                    </div>
                    <div class="p-2.5 bg-amber-50 rounded-2xl border border-amber-200">

        // إحصائيات حضور موحدة تعتمد على سجل الغياب عند توفره، وعلى العدادات في غير ذلك
        function getStudentAbsenceMetrics(student) {
            const logs = Array.isArray(student.absenceLog) ? student.absenceLog : [];
            const absentLogs = logs.filter(log => log && log.status === 'غائب');
            const excusedLogs = logs.filter(log => log && log.status === 'مجاز');
            const absentCount = Math.max(Number(student.absenceCount) || 0, absentLogs.length);
            const excusedCount = Math.max(Number(student.excusedCount) || 0, excusedLogs.length);
            const attendanceCount = Math.max(Number(student.attendanceCount) || 0, 0);
            const totalLectures = attendanceCount + absentCount + excusedCount;
            const absenceRate = totalLectures > 0 ? (absentCount / totalLectures) * 100 : 0;
            const absenceDates = absentLogs.map(log => `${log.day ? log.day + ' ' : ''}${log.date || ''}`.trim()).filter(Boolean);
            return { absentCount, excusedCount, attendanceCount, totalLectures, absenceRate, absenceLogs: absentLogs, absenceDates };
        }

                    String(student.section || '').trim() === String(sSec || '').trim() &&
                    String(student.studyType || 'صباحي').trim() === String(sStudy || 'صباحي').trim()
                );
            }
            if (searchKey) filtered = filtered.filter(student => String(student.name || '').toLowerCase().includes(searchKey));

            let candidates = filtered.map(student => ({ student, metrics: getStudentAbsenceMetrics(student) }));
            if (selectedStudentId === 'all') candidates = candidates.filter(item => item.metrics.absentCount >= 2);
            candidates.sort((a, b) => String(a.student.name || '').localeCompare(String(b.student.name || ''), 'ar'));

            const printClassVal = selectedStudentId !== 'all' && candidates[0]
                ? `${candidates[0].student.class} - ${candidates[0].student.section} - ${candidates[0].student.studyType || 'صباحي'}`
                : classFilterVal;
            setPrintHeaderStageLabelUnified('rep-freq-stage', printClassVal);

            const rows = candidates.map(({ student, metrics }, index) => {
                const dateList = metrics.absenceDates.length ? metrics.absenceDates.join('، ') : (metrics.absentCount ? `${metrics.absentCount} غيابات مسجلة دون تواريخ تفصيلية` : 'لا توجد غيابات مسجلة');
                const frequent = metrics.absentCount >= 2;
                return `<tr class="border-b border-orange-100 text-[10px] ${frequent ? 'bg-orange-50/60' : ''}">
                    <td class="p-2 text-center font-bold">${index + 1}</td>
                    <td class="p-2 font-bold text-slate-900">${student.name}<div class="text-[9px] font-medium text-slate-500">${student.class} - شعبة ${student.section} (${student.studyType || 'صباحي'})</div></td>
                    <td class="p-2 text-center font-black ${frequent ? 'text-rose-700' : 'text-slate-700'}">${metrics.absentCount}</td>
                    <td class="p-2 text-center font-black">${metrics.absenceRate.toFixed(1)}%</td>
                    <td class="p-2 leading-relaxed">${dateList}</td>
                </tr>`;
            }).join('');

            body.innerHTML = rows || `<tr><td colspan="5" class="p-4 text-center text-xs font-bold text-slate-500">${selectedStudentId !== 'all' ? 'لا توجد غيابات متكررة مسجلة لهذا الطالب ضمن البيانات الحالية' : 'لا توجد حالات غياب متكرر مطابقة للفلاتر المحددة'}</td></tr>`;
        }

        // 12. تجاوز نسبة الغياب: عرض جماعي لمن تجاوز 10% أو كشف فردي للطالب المختار
        function updateAttExceededReport() {
            const classEl = document.getElementById('rep-exc-class');
            const studentEl = document.getElementById('rep-exc-student');
            const body = document.getElementById('att-exc-report-body');
            if (!classEl || !body) return;

            const classFilterVal = classEl.value;
            const selectedStudentId = studentEl ? String(studentEl.value || 'all') : 'all';
            const searchKey = getSearchKeyword();
            let filtered = [...appState.students];

            if (selectedStudentId !== 'all') {
                filtered = filtered.filter(student => String(student.id) === selectedStudentId);
            } else if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(student =>
                    String(student.class || '').trim() === String(cName || '').trim() &&
                    String(student.section || '').trim() === String(sSec || '').trim() &&
                    String(student.studyType || 'صباحي').trim() === String(sStudy || 'صباحي').trim()
                );
            }
            if (searchKey) filtered = filtered.filter(student => String(student.name || '').toLowerCase().includes(searchKey));

            const selectedStudent = selectedStudentId !== 'all' ? filtered[0] : null;
            let candidates = filtered.map(student => ({ student, metrics: getStudentAbsenceMetrics(student) }));
            if (selectedStudentId === 'all') candidates = candidates.filter(item => item.metrics.totalLectures > 0 && item.metrics.absenceRate > 10);
            candidates.sort((a, b) => String(a.student.name || '').localeCompare(String(b.student.name || ''), 'ar'));

            const printClassVal = selectedStudentId !== 'all' && selectedStudent
                ? `${selectedStudent.class} - ${selectedStudent.section} - ${selectedStudent.studyType || 'صباحي'}`
                : classFilterVal;
            setPrintHeaderStageLabelUnified('rep-exc-stage', printClassVal);

            const rows = candidates.map(({ student, metrics }, index) => {
                const exceeded = metrics.totalLectures > 0 && metrics.absenceRate > 10;
                return `<tr class="border-b border-rose-100 text-[11px] ${exceeded ? 'bg-rose-50/60' : ''}">
                    <td class="p-2 text-center font-bold">${index + 1}</td>
                    <td class="p-2 font-bold text-slate-900">${student.name}<div class="text-[9px] font-medium text-slate-500">${student.class} - شعبة ${student.section} (${student.studyType || 'صباحي'})</div></td>
                    <td class="p-2 text-center font-black text-rose-700">${metrics.absentCount} غيابات</td>
                    <td class="p-2 text-center font-black ${exceeded ? 'text-rose-800' : 'text-emerald-700'}">${metrics.absenceRate.toFixed(1)}%<div class="text-[9px]">${exceeded ? 'متجاوز الحد' : 'ضمن الحد المسموح'}</div></td>
                </tr>`;
            }).join('');

            body.innerHTML = rows || `<tr><td colspan="4" class="p-4 text-center text-xs font-bold text-slate-500">${selectedStudentId !== 'all' ? 'لا توجد بيانات حضور وغياب كافية لحساب نسبة هذا الطالب' : 'لا يوجد طلبة تجاوزوا نسبة 10% من الغياب ضمن الفلاتر المحددة'}</td></tr>`;
        }

            const scope = document.getElementById('rep-att-scope').value;

            if (scope === 'all_students') {
                if (singleBox) singleBox.classList.add('hidden');

                if (singleBox) singleBox.classList.remove('hidden');
                renderSelectedStudentAttReport();

            const scope = document.getElementById('rep-att-scope').value;
            if (scope === 'all_students') {
                renderAllStudentsAttendanceReport();

                updateAttStudentDropdown();
            }

        function updateAttStudentDropdown() {
            const classFilterVal = document.getElementById('rep-att-st-class').value;
            const stSelect = document.getElementById('rep-att-st-id');
            const searchKey = getSearchKeyword();

            setPrintHeaderStageLabelUnified('rep-att-st-stage', classFilterVal);
            
            let filtered = [...appState.students];
            if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            if (searchKey) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchKey));
            }

            filtered = sortStudentsAlphabetically(filtered);
            
            if (stSelect) {
                const previousStudentId = String(stSelect.value || '');
                stSelect.innerHTML = filtered.map(s => `<option value="${String(s.id)}">${s.name} (${s.class} - ${s.section})</option>`).join('') || '<option value="">لا يوجد طلبة</option>';

                    stSelect.value = previousStudentId;
                } else if (filtered.length) {
                    stSelect.value = String(filtered[0].id);
                }
            }

            const scope = document.getElementById('rep-att-scope') ? document.getElementById('rep-att-scope').value : 'single';
            if (scope === 'all_students') {
                renderAllStudentsAttendanceReport();
            } else {
                renderSelectedStudentAttReport();
            }
        }

        function saveUpdatedClassItem(classId) {
            let cls = appState.classes.find(c => c.id === classId);
            if (!cls) return;

            let newName = document.getElementById('edit-cls-name').value.trim();
            let newSec = document.getElementById('edit-cls-section').value.trim();
            let newStudy = document.getElementById('edit-cls-study').value;

            if (!newName || !newSec) {
                showToast("الرجاء ملء اسم المرحلة والشعبة", "error");
                return;
            }

            const oldName = cls.name;
            const oldSec = cls.section;

            cls.name = newName;
            cls.section = newSec;
            cls.studyType = newStudy;

            appState.students.forEach(st => {
                if (st.class === oldName && st.section === oldSec) {
                    st.class = newName;
                    st.section = newSec;
                    st.studyType = newStudy;
                }
            });

            syncStateToCloud();
            showToast("تم تعديل المرحلة والشعبة والدراسة بنجاح!");
            triggerAction('add_class');
            updateStatsBar();
            renderContent();

        // 2. إدارة الطلبة المسجلين مع البحث الفوري بالاسم
        function normalizeStudentSearchText(value) {
            return String(value || '')
                .toLocaleLowerCase('ar')
                .normalize('NFD')
                .replace(/[\u064B-\u065F\u0670]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .trim();
        }

                    </div>
                    <p id="registered-students-count" class="text-[10px] text-slate-500 font-bold mb-1">عدد الطلبة: ${sortedStudents.length}</p>
                    <div id="registered-students-list" class="max-h-80 overflow-y-auto custom-scroll">
                        ${studentRows || ''}

                    </div>
                </div>
            `;

        function filterRegisteredStudentsList() {
            const searchInput = document.getElementById('registered-students-search');
            const list = document.getElementById('registered-students-list');
            if (!searchInput || !list) return;

            const query = normalizeStudentSearchText(searchInput.value);
            const cards = Array.from(list.querySelectorAll('.registered-student-card'));
            let visibleCount = 0;

            cards.forEach((card, index) => {
                const name = normalizeStudentSearchText(card.dataset.studentName || card.querySelector('h5')?.textContent || '');
                const matches = !query || name.includes(query);
                card.classList.toggle('hidden', !matches);
                if (matches) {
                    visibleCount++;
                    const rowNumber = card.querySelector('.registered-student-index');
                    if (rowNumber) rowNumber.textContent = String(visibleCount);
                }
            });

            const count = document.getElementById('registered-students-count');
            if (count) count.textContent = query
                ? `نتائج البحث: ${visibleCount} من ${cards.length}`
                : `عدد الطلبة: ${cards.length}`;

            const empty = document.getElementById('registered-students-empty');
            if (empty) {
                empty.classList.toggle('hidden', visibleCount > 0);
                empty.textContent = cards.length === 0
                    ? 'لا يوجد طلبة مسجلين حالياً'
                    : 'لا توجد أسماء مطابقة للبحث';
            }
        }

                    <div class="pt-1">
                        <h4 class="font-bold text-xs text-slate-700 mb-2">المواد الدراسية المسجلة:</h4>
                        <div class="max-h-56 overflow-y-auto custom-scroll space-y-1">${subjectRows || '<p class="text-xs text-center text-slate-400 py-3">لا توجد مواد مسجلة</p>'}</div>
                    </div>
                </div>
            `;
        }

        function editSubjectItem(subjectId) {
            let sub = appState.subjects.find(s => s.id === subjectId);
            if (!sub) return;

            let classDropdowns = appState.classes.map(c => `<option value="${c.name}" ${sub.class === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

            let container = document.getElementById('modal-body');
            container.innerHTML = `
                <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-2xl mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-600"></i>
                    <p class="text-[10px] font-bold text-slate-800">تعديل المادة: ${sub.name}</p>
                </div>
                <div class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">اسم المادة الجامعية:</label>
                        <input id="edit-sub-name" type="text" value="${sub.name}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">المرحلة المرتبطة بالمادة:</label>
                        <select id="edit-sub-class" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none">
                            ${classDropdowns}
                        </select>
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button onclick="saveUpdatedSubjectItem(${sub.id})" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700">حفظ التعديل</button>
                        <button onclick="triggerAction('add_subject')" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold text-xs">إلغاء</button>
                    </div>
                </div>
            `;
        }

        function saveUpdatedSubjectItem(subjectId) {
            let sub = appState.subjects.find(s => s.id === subjectId);
            if (!sub) return;

            let newName = document.getElementById('edit-sub-name').value.trim();
            let newClass = document.getElementById('edit-sub-class').value;

            if (!newName) {
                showToast("الرجاء إدخال اسم المادة", "error");
                return;
            }

            sub.name = newName;
            sub.class = newClass;

            syncStateToCloud();
            showToast("تم تعديل بيانات المادة الدراسية بنجاح!");
            triggerAction('add_subject');
            updateStatsBar();
            renderContent();
        }

        function deleteSubjectItem(subjectId) {
            if (!confirm("هل أنت متأكد من رغبتك في حذف هذه المادة الدراسية؟")) return;

            appState.subjects = appState.subjects.filter(s => s.id !== subjectId);
            syncStateToCloud();
            showToast("تم حذف المادة الدراسية بنجاح!");
            triggerAction('add_subject');
            updateStatsBar();
            renderContent();
        }

        function closeModal() {
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        function handleModalSubmit() {
            if (currentModalType === 'add_class') {
                const name = document.getElementById('inp-class-name').value;
                const section = document.getElementById('inp-class-section').value;
                const studyType = document.getElementById('inp-class-study').value;
                if (!name || !section) { showToast("الرجاء إدخال البيانات المطلوبة", "error"); return; }
                appState.classes.push({ id: Date.now(), name, section, studyType, count: 0 });
                showToast("تمت إضافة المرحلة والشعبة بنجاح");
            } 
            else if (currentModalType === 'add_student') {
                const name = document.getElementById('inp-std-name').value;
                const classVal = document.getElementById('inp-std-class').value;
                if (!name.trim()) { showToast("الرجاء إدخال اسم الطالب", "error"); return; }
                const [className, sectionPart, studyPart] = classVal.split(" - ");
                appState.students.push({ 
                    id: Date.now(), 
                    name: name.trim(), 
                    class: className, 
                    section: sectionPart || "أ", 
                    studyType: studyPart || "صباحي",
                    year: appState.schoolInfo.year, 
                    behavior: "جديد", 
                    note: "طالب مسجل حديثًا", 
                    t1Exam: 0, t1Eval: 0,
                    t2Exam: 0, t2Eval: 0,
                    final: 0,
                    attendanceCount: 0, 
                    absenceCount: 0,
                    excusedCount: 0,
                    absenceLog: [],
                    behaviorLog: []
                });
                showToast("تم إضافة الطالب بنجاح");
            } else if (currentModalType === 'add_subject') {
                const name = document.getElementById('inp-sub-name').value;
                const className = document.getElementById('inp-sub-class').value;
                if (!name) { showToast("الرجاء إدخال اسم المادة", "error"); return; }
                appState.subjects.push({ id: Date.now(), name, class: className, teacher: appState.schoolInfo.teacher });
                showToast("تمت إضافة المادة الدراسية بنجاح");
            } else if (currentModalType === 'add_schedule_item') {
                const day = document.getElementById('sch-day').value;
                const subject = document.getElementById('sch-subject').value;
                const time = document.getElementById('sch-time').value || "08:30 - 10:30";
                const classVal = document.getElementById('sch-class-select').value;
                const hall = document.getElementById('sch-hall').value || "قاعة عامة";
                const [className, sectionPart, studyPart] = classVal.split(" - ");

                appState.schedule.push({ 
                    id: Date.now(), 
                    day, 
                    subject, 
                    className: `${className} (${sectionPart} - ${studyPart})`, 
                    time: time, 
                    hall: hall 
                });
                showToast("تمت إضافة المحاضرة للجدول");
            } 
            else if (currentModalType === 'edit_school_info') {
                // تهيئة كائن البيانات وضمان قراءة جميع الحقول الظاهرة في النموذج قبل الحفظ.
                if (!appState.schoolInfo || typeof appState.schoolInfo !== 'object') appState.schoolInfo = {};
                const schoolNameInput = document.getElementById('inp-sch-name');
                const universityInput = document.getElementById('inp-sch-university');
                const collegeInput = document.getElementById('inp-sch-college');
                const departmentInput = document.getElementById('inp-sch-department');
                const teacherInput = document.getElementById('inp-sch-teacher');
                const subjectInput = document.getElementById('inp-sch-subj');
                const yearInput = document.getElementById('inp-sch-year');

                if (schoolNameInput) appState.schoolInfo.name = schoolNameInput.value.trim() || appState.schoolInfo.name || '';
                if (universityInput) appState.schoolInfo.university = universityInput.value.trim();
                if (collegeInput) appState.schoolInfo.college = collegeInput.value.trim();
                if (departmentInput) appState.schoolInfo.department = departmentInput.value.trim();
                if (teacherInput) appState.schoolInfo.teacher = teacherInput.value.trim() || appState.schoolInfo.teacher || '';
                if (subjectInput) appState.schoolInfo.subject = subjectInput.value.trim() || appState.schoolInfo.subject || '';
                if (yearInput) appState.schoolInfo.year = yearInput.value.trim() || appState.schoolInfo.year || '';

                // تتم الكتابة للحفظ المحلي ومزامنة الخدمات السحابية مباشرة بعد انتهاء هذا الفرع.
                showToast("تم حفظ بيانات الجامعة والكلية والقسم والأستاذ بنجاح");
            } else if (currentModalType === 'edit_google_config') {
                const clientInput = document.getElementById('google-client-id-input');
                if (clientInput) appState.googleConfig.clientId = clientInput.value.trim();
                if (!appState.googleConfig) appState.googleConfig = { clientId: "", connected: false, fileId: "" };
                syncStateToCloud();
                updateGoogleDriveStatus();
                showToast("تم حفظ إعدادات الربط مع Google");
            } else {
                showToast("تم حفظ التعديلات بنجاح");
            }

            syncStateToCloud();
            closeModal();
            updateStatsBar();
            renderContent();
        }

        function executeBulkImport() {
            const text = document.getElementById('inp-bulk-names').value;
            const classVal = document.getElementById('import-std-class').value;

            if (!text.trim()) { showToast("الرجاء إدخال الأسماء أولاً", "error"); return; }
            const [className, sectionPart, studyPart] = classVal.split(" - ");

            const lines = text.split('\n');
            let added = 0;
            lines.forEach(line => {
                if (line.trim()) {
                    appState.students.push({
                        id: Date.now() + Math.random(),
                        name: line.trim(),
                        class: className,
                        section: sectionPart || "أ",
                        studyType: studyPart || "صباحي",
                        year: appState.schoolInfo.year,
                        behavior: "مميز",
                        note: "مستورد",
                        t1Exam: 0, t1Eval: 0,
                        t2Exam: 0, t2Eval: 0,
                        final: 0,
                        attendanceCount: 0, absenceCount: 0, excusedCount: 0,
                        absenceLog: [],
                        behaviorLog: []
                    });
                    added++;
                }
            });
            syncStateToCloud();
            showToast(`تم استيراد ${added} طالباً بنجاح!`);
            closeModal();
            updateStatsBar();
            renderContent();
        }

        function deleteScheduleItem(itemId) {
            appState.schedule = appState.schedule.filter(s => s.id !== itemId);
            syncStateToCloud();
            showToast("تم حذف المحاضرة من الجدول");
            renderContent();
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 120;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const optimizedLogo = canvas.toDataURL('image/png', 0.8);

                    appState.schoolInfo.logo = optimizedLogo;
                    const box = document.getElementById('logo-preview-box');
                    if (box) {
                        box.innerHTML = `<img src="${optimizedLogo}" class="w-full h-full object-contain">`;
                    }
                    updateStatsBar();
                    syncStateToCloud();
                    showToast("تم حفظ وضغط الشعار بنجاح!");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function downloadLocalBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `academic_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تنزيل ملف النسخة الاحتياطية!");
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('translate-y-0');
            }, 2000);
        }

        window.onload = function() {
            try {
                const cached = localStorage.getItem('sp_academic_local_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.students) {
                        const cloudCfg = appState.supabaseConfig;
                        const googleCfg = parsed.googleConfig || appState.googleConfig || { clientId: "", connected: false, fileId: "" };
                        appState = parsed;
                        appState.supabaseConfig = cloudCfg;
                        appState.googleConfig = googleCfg;
                        normalizeAppState();
                    }
                }
            } catch(e) {
                console.warn("Local storage cache read error:", e);
            }

            normalizeAppState();
            // access tokens are memory-only; the user may reconnect from Settings to restore the Drive backup.
            if (appState.googleConfig) appState.googleConfig.connected = false;
            initSupabase();
            switchTab(1);
        };
    </script>
</body>
